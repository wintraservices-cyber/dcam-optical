<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sales — DCAM Optical (Staff)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Sora:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --purple: #B05A9E;
    --purple-deep: #8F4680;
    --blue: #5BAFC0;
    --blue-deep: #458F9E;
    --ivory: #F7F1E8;
    --ivory-dim: #EFE6D8;
    --charcoal: #383334;
    --charcoal-soft: #4A4547;
    --line: rgba(56,51,52,0.14);
    --green: #3E8E5A;
    --red: #B0405A;
    --display: 'Plus Jakarta Sans', sans-serif;
    --body: 'Sora', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--ivory); color: var(--charcoal); font-family: var(--body); }

  .staff-bar {
    background: var(--charcoal);
    color: var(--ivory);
    padding: 14px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
  }
  .staff-bar .tag {
    font-family: var(--display);
    font-weight: 700;
    font-size: 0.82rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--blue);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .staff-bar .actions { display: flex; gap: 10px; flex-wrap: wrap; }
  .staff-bar a, .staff-bar button {
    font-family: var(--display);
    font-weight: 600;
    font-size: 0.85rem;
    padding: 9px 18px;
    border-radius: 100px;
    border: none;
    cursor: pointer;
    text-decoration: none;
    display: inline-block;
  }
  .btn-light { background: var(--ivory); color: var(--charcoal); }
  .btn-ghost { background: transparent; color: var(--ivory); border: 1px solid rgba(247,241,232,0.4) !important; }
  .btn-ghost:hover { background: rgba(247,241,232,0.1); }

  .wrap { max-width: 1040px; margin: 0 auto; padding: 32px 24px 80px; }

  h1.page-title { font-family: var(--display); font-size: 1.3rem; margin-bottom: 4px; }
  .page-subtitle { color: var(--charcoal-soft); font-size: 0.88rem; margin-bottom: 22px; }

  .card {
    background: #fff;
    border-radius: 16px;
    padding: 22px 24px;
    margin-bottom: 22px;
    box-shadow: 0 10px 30px rgba(56,51,52,0.06);
  }
  .card h2 {
    font-family: var(--display);
    font-size: 1rem;
    margin-bottom: 14px;
  }
  .card p.note {
    font-size: 0.85rem;
    color: var(--charcoal-soft);
    margin-bottom: 14px;
    line-height: 1.5;
  }

  .seed-grid {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr 1fr auto;
    gap: 10px;
    align-items: end;
  }
  .field label {
    display: block;
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--charcoal-soft);
    margin-bottom: 4px;
    font-family: var(--display);
    font-weight: 700;
  }
  .field input {
    width: 100%;
    border: 1.5px solid var(--line);
    background: #fff;
    padding: 10px 12px;
    border-radius: 8px;
    font-family: var(--body);
    font-size: 0.9rem;
    color: var(--charcoal);
    outline: none;
  }
  .field input:focus { border-color: var(--blue); }

  .btn-primary {
    font-family: var(--display);
    font-weight: 700;
    font-size: 0.85rem;
    padding: 10px 20px;
    border-radius: 8px;
    border: none;
    background: var(--purple);
    color: #fff;
    cursor: pointer;
    white-space: nowrap;
  }
  .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }
  .btn-primary.confirm { background: var(--green); }

  .status-msg { font-size: 0.82rem; margin-top: 10px; }
  .status-msg.error { color: var(--red); }
  .status-msg.success { color: var(--green); }

  .balance-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 14px;
    margin-bottom: 18px;
  }
  .balance-tile {
    background: var(--ivory-dim);
    border-radius: 12px;
    padding: 14px 16px;
  }
  .balance-tile .label {
    font-family: var(--display);
    font-weight: 700;
    font-size: 0.68rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--charcoal-soft);
    margin-bottom: 6px;
  }
  .balance-tile .value {
    font-family: var(--display);
    font-weight: 800;
    font-size: 1.15rem;
  }

  .section-label {
    font-family: var(--display);
    font-weight: 700;
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--purple-deep);
    margin: 18px 0 10px;
  }

  .activity-list { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 24px; margin-bottom: 4px; }
  .activity-row {
    display: flex;
    justify-content: space-between;
    padding: 8px 0;
    border-bottom: 1px solid var(--line);
    font-size: 0.9rem;
  }
  .activity-row .amt { font-family: var(--display); font-weight: 700; }
  .activity-row .amt.pos { color: var(--green); }
  .activity-row .amt.neg { color: var(--red); }

  .close-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    flex-wrap: wrap;
    margin-top: 18px;
    padding-top: 18px;
    border-top: 1.5px solid var(--line);
  }
  .closed-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-family: var(--display);
    font-weight: 700;
    font-size: 0.78rem;
    color: var(--green);
  }

  table {
    width: 100%;
    border-collapse: collapse;
    background: #fff;
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 10px 30px rgba(56,51,52,0.06);
  }
  thead th {
    text-align: left;
    font-family: var(--display);
    font-weight: 700;
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--charcoal-soft);
    background: var(--ivory-dim);
    padding: 10px 14px;
    white-space: nowrap;
  }
  tbody td {
    padding: 10px 14px;
    border-top: 1px solid var(--line);
    font-size: 0.85rem;
    white-space: nowrap;
  }
  tbody tr:hover { background: var(--ivory-dim); }

  .not-admin-state { text-align: center; padding: 80px 20px; color: var(--charcoal-soft); }
  .empty-state, .loading-state, .error-state {
    text-align: center;
    padding: 40px 20px;
    color: var(--charcoal-soft);
    font-size: 0.95rem;
  }
  .error-state { color: var(--red); }

  @media (max-width: 720px) {
    .seed-grid { grid-template-columns: 1fr 1fr; }
    .seed-grid .btn-primary { grid-column: 1 / -1; }
    .balance-grid { grid-template-columns: 1fr 1fr; }
    .activity-list { grid-template-columns: 1fr; }
    table, thead, tbody, th, td, tr { display: block; }
    thead { display: none; }
    tbody tr {
      border: 1px solid var(--line);
      border-radius: 10px;
      margin-bottom: 12px;
      padding: 10px 14px;
    }
    tbody td {
      border: none;
      padding: 6px 0;
      display: flex;
      justify-content: space-between;
      gap: 10px;
      white-space: normal;
    }
    tbody td::before {
      content: attr(data-label);
      font-family: var(--display);
      font-weight: 700;
      font-size: 0.7rem;
      text-transform: uppercase;
      color: var(--charcoal-soft);
    }
  }
  body.embed .staff-bar { display: none; }
  body.embed .page-title, body.embed .page-subtitle { display: none; }
  .bod-edit { display:grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  @media (max-width: 640px) { .bod-edit { grid-template-columns: 1fr 1fr; } }
  .bod-actions { display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; align-items:center; }
  .btn-link { background:none; border:0; color:var(--charcoal-soft); text-decoration:underline; cursor:pointer; font:inherit; font-size:0.82rem; padding:4px 2px; }
  .ss-top { display:grid; grid-template-columns: 1fr auto; gap:6px 24px; max-width:420px; font-weight:700; margin-bottom:14px; }
  .ss-top span:nth-child(even) { text-align:right; font-variant-numeric: tabular-nums; }
  table.ss td:nth-child(n+2), table.ss th:nth-child(n+2) { text-align:right; font-variant-numeric: tabular-nums; }
  .ss-ctl { display:flex; gap:10px; align-items:center; margin-bottom:12px; font-size:0.85rem; }

  body.embed .staff-bar { display: none; }
  .wrap { padding: 24px; }
  .ctl { display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end; margin-bottom:14px; }
  .ctl label { display:block; font-size:0.72rem; text-transform:uppercase; letter-spacing:.05em; color:var(--charcoal-soft); font-weight:600; margin-bottom:4px; }
  .ctl input[type=date] { border:1.5px solid var(--line); border-radius:8px; padding:8px 10px; font-family:var(--body); background:#fff; }
  .ctl button, .ctl a.dl { border:1px solid var(--line); background:#fff; border-radius:8px; padding:9px 12px; cursor:pointer; font-family:var(--body); font-size:0.82rem; color:var(--charcoal); text-decoration:none; }
  .tiles { display:grid; grid-template-columns: repeat(auto-fit, minmax(150px,1fr)); gap:10px; margin-bottom:14px; }
  .tile { background:#fff; border:1px solid var(--line); border-radius:12px; padding:12px 14px; }
  .tile .l { font-size:0.72rem; text-transform:uppercase; letter-spacing:.05em; color:var(--charcoal-soft); }
  .tile .v { font-family:var(--display); font-weight:800; font-size:1.15rem; margin-top:4px; font-variant-numeric:tabular-nums; }
  .tbl { overflow-x:auto; background:#fff; border:1px solid var(--line); border-radius:12px; }
  .tbl table { width:100%; border-collapse:collapse; font-size:0.82rem; white-space:nowrap; }
  .tbl th { text-align:left; padding:9px 12px; background:var(--ivory-dim); font-size:0.72rem; text-transform:uppercase; letter-spacing:.04em; }
  .tbl td { padding:8px 12px; border-top:1px solid var(--line); }
  .msg { padding:24px; text-align:center; color:var(--charcoal-soft); }
</style>
<script src="tech-guard.js"></script>
</head>
<body>
<script>if (/[?&]embed=1/.test(location.search)) document.body.classList.add('embed');</script>
<div class="staff-bar">
  <div class="tag">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
    Staff only — sales
  </div>
  <div class="actions">
    <a href="staff-dashboard.html" class="btn-light">Dashboard</a>
    <a href="staff-orders.html" class="btn-light">Orders</a>
    <a href="staff-catalog.html" class="btn-light">Catalog</a>
    <a href="staff-reports.html" class="btn-light">Reports</a>
    <a href="staff-finance.html" class="btn-light nav-admin-only">Finance</a>
    <a href="staff-settings.html" class="btn-light nav-admin-only">Settings</a>
    <a href="staff-patient-lookup.html" class="btn-light">Patient lookup</a>
    <a href="staff-profile.html" class="btn-light">Profile</a>
    <button class="btn-ghost" id="logoutBtn">Log out</button>
  </div>
</div>

<div class="wrap" id="main" style="display:none;">
  <div class="ctl">
    <div id="periodFilterMount"></div>
    <a class="dl" id="dl" href="#">Download CSV</a>
  </div>
  <div class="tiles" id="tiles"></div>
  <div class="tbl" id="tbl"><div class="msg">Loading…</div></div>
</div>
<div class="msg" id="denied" style="display:none;">Sales is available to admin accounts.</div>
<script src="period-filter.js"></script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  function esc(v) { return String(v == null ? '' : v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function peso(n) { return '₱' + Number(n || 0).toLocaleString('en-PH', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
  var MONEY = { 'Total': 1, 'Payment Today': 1, 'Balance': 1 };
  var periodFilter = PeriodFilter.mount($('periodFilterMount'), { defaultPreset: 'this_month', onChange: function () { load(); } });
  async function load() {
    var rg = periodFilter.getRange();
    var q = 'type=sales' + (rg.from ? '&from=' + rg.from : '') + (rg.to ? '&to=' + rg.to : '');
    $('dl').href = '/api/reports?' + q;
    $('tbl').innerHTML = '<div class="msg">Loading…</div>';
    try {
      var resp = await fetch('/api/reports?' + q + '&format=json');
      var r = await resp.json();
      if (!resp.ok || !r.ok) throw new Error(r.error || 'Could not load sales.');
      var t = r.totals;
      $('tiles').innerHTML = [['Total billed', t.amount], ['Deposits', t.deposit], ['Balance payments', t.balance_payments], ['Collected', t.collected], ['Still owed', t.balance]]
        .map(function (x) { return '<div class="tile"><div class="l">' + x[0] + '</div><div class="v">' + peso(x[1]) + '</div></div>'; }).join('');
      if (!r.rows.length) { $('tbl').innerHTML = '<div class="msg">No sales in this period.</div>'; return; }
      var head = '<tr>' + r.columns.map(function (c) { return '<th>' + esc(c) + '</th>'; }).join('') + '</tr>';
      var body = r.rows.map(function (row) {
        return '<tr>' + row.map(function (v, i) {
          var c = r.columns[i];
          if (MONEY[c] && v !== '' && v != null && !isNaN(parseFloat(v))) return '<td style="text-align:right">' + peso(v) + '</td>';
          if (c === 'Payment Method') v = v === 'gcash_cc' ? 'GCash/CC' : v === 'cash' ? 'Cash' : v;
          return '<td>' + esc(v) + '</td>';
        }).join('') + '</tr>';
      }).join('');
      $('tbl').innerHTML = '<table><thead>' + head + '</thead><tbody>' + body + '</tbody></table>';
    } catch (e) { $('tbl').innerHTML = '<div class="msg">' + esc(e.message) + '</div>'; }
  }
  $('logoutBtn').addEventListener('click', async function () { await fetch('/api/staff-auth?action=logout', { method: 'POST' }); location.href = 'staff-login.html'; });
  (async function () {
    var a; try { a = await (await fetch('/api/staff-auth')).json(); } catch (e) { a = null; }
    if (!a || !a.authenticated) { location.href = 'staff-login.html?next=staff-sales.html'; return; }
    if (a.role !== 'admin') { document.querySelectorAll('.nav-admin-only').forEach(function (el) { el.remove(); }); $('denied').style.display = 'block'; return; }
    $('main').style.display = 'block';
    load();
  })();
})();
</script>
</body>
</html>
