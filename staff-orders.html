<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orders — DCAM Optical (Staff)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Sora:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --purple: #B05A9E;
    --purple-deep: #8F4680;
    --blue: #5BAFC0;
    --blue-deep: #458F9E;
    --ivory: #F7F1E8;
    --ivory-dim: #EFE6D8;
    --charcoal: #383334;
    --charcoal-soft: #4A4547;
    --line: rgba(56,51,52,0.14);
    --display: 'Plus Jakarta Sans', sans-serif;
    --body: 'Sora', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--ivory); color: var(--charcoal); font-family: var(--body); }

  .staff-bar {
    background: var(--charcoal);
    color: var(--ivory);
    padding: 14px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
  }
  .staff-bar .tag {
    font-family: var(--display);
    font-weight: 700;
    font-size: 0.82rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--blue);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .staff-bar .actions { display: flex; gap: 10px; }
  .staff-bar a, .staff-bar button {
    font-family: var(--display);
    font-weight: 600;
    font-size: 0.85rem;
    padding: 9px 18px;
    border-radius: 100px;
    border: none;
    cursor: pointer;
    text-decoration: none;
    display: inline-block;
  }
  .btn-light { background: var(--ivory); color: var(--charcoal); }
  .btn-ghost { background: transparent; color: var(--ivory); border: 1px solid rgba(247,241,232,0.4) !important; }
  .btn-ghost:hover { background: rgba(247,241,232,0.1); }

  .wrap { max-width: 1040px; margin: 0 auto; padding: 32px 24px 80px; }

  .controls {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 24px;
  }
  .controls input[type="text"] {
    flex: 1;
    min-width: 220px;
    border: 1.5px solid var(--line);
    background: #fff;
    padding: 12px 16px;
    border-radius: 10px;
    font-family: var(--body);
    font-size: 0.92rem;
    color: var(--charcoal);
    outline: none;
  }
  .controls input[type="text"]:focus { border-color: var(--blue); }
  .status-filter { display: flex; gap: 8px; }
  .status-filter button {
    font-family: var(--display);
    font-weight: 600;
    font-size: 0.82rem;
    padding: 10px 16px;
    border-radius: 100px;
    border: 1.5px solid var(--line);
    background: #fff;
    color: var(--charcoal-soft);
    cursor: pointer;
  }
  .status-filter button.active {
    border-color: var(--purple);
    background: rgba(176,90,158,0.08);
    color: var(--purple-deep);
  }

  table {
    width: 100%;
    border-collapse: collapse;
    background: #fff;
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 10px 30px rgba(56,51,52,0.06);
  }
  thead th {
    text-align: left;
    font-family: var(--display);
    font-weight: 700;
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--charcoal-soft);
    background: var(--ivory-dim);
    padding: 12px 16px;
  }
  tbody td {
    padding: 14px 16px;
    border-top: 1px solid var(--line);
    font-size: 0.9rem;
  }
  tbody tr:hover { background: var(--ivory-dim); }

  .status-pill {
    display: inline-block;
    font-family: var(--display);
    font-weight: 700;
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    padding: 4px 12px;
    border-radius: 100px;
  }
  .status-pill.ordered { background: rgba(91,175,192,0.14); color: var(--blue-deep); }
  .status-pill.ready { background: rgba(176,90,158,0.14); color: var(--purple-deep); }
  .status-pill.claimed { background: rgba(56,51,52,0.1); color: var(--charcoal-soft); }

  .type-tag {
    display: inline-block;
    font-family: var(--display);
    font-weight: 700;
    font-size: 0.65rem;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    padding: 2px 8px;
    border-radius: 100px;
    margin-left: 8px;
  }
  .type-tag.rx { background: rgba(176,90,158,0.14); color: var(--purple-deep); }
  .type-tag.non-rx { background: rgba(56,51,52,0.1); color: var(--charcoal-soft); }

  select.status-select {
    font-family: var(--body);
    font-size: 0.82rem;
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 5px 8px;
    background: #fff;
    color: var(--charcoal);
  }

  .log-payment-btn {
    font-family: var(--display);
    font-weight: 600;
    font-size: 0.72rem;
    padding: 4px 10px;
    border-radius: 100px;
    border: 1px solid var(--purple);
    background: #fff;
    color: var(--purple-deep);
    cursor: pointer;
    margin-top: 4px;
    display: inline-block;
  }
  .log-payment-btn:hover { background: rgba(176,90,158,0.08); }

  .payment-panel {
    display: none;
    background: var(--ivory-dim);
    border-radius: 10px;
    padding: 12px;
    margin-top: 8px;
  }
  .payment-panel.open { display: block; }
  .payment-panel-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-bottom: 8px;
  }
  .payment-panel input, .payment-panel select {
    width: 100%;
    padding: 6px 8px;
    border: 1px solid var(--line);
    border-radius: 6px;
    font-family: var(--body);
    font-size: 0.82rem;
  }
  .payment-panel-actions {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .payment-panel-save {
    font-family: var(--display);
    font-weight: 700;
    font-size: 0.78rem;
    padding: 6px 14px;
    border-radius: 8px;
    border: none;
    background: var(--purple);
    color: var(--ivory);
    cursor: pointer;
  }
  .payment-panel-status { font-size: 0.78rem; }
  .payment-panel-status.error { color: #B0405A; }
  .payment-panel-status.success { color: #3E8E5A; }

  .empty-state, .loading-state, .error-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--charcoal-soft);
    font-size: 0.95rem;
  }
  .error-state { color: #B0405A; }

  @media (max-width: 720px) {
    table, thead, tbody, th, td, tr { display: block; }
    thead { display: none; }
    tbody tr {
      border: 1px solid var(--line);
      border-radius: 10px;
      margin-bottom: 12px;
      padding: 10px 14px;
    }
    tbody td {
      border: none;
      padding: 6px 0;
      display: flex;
      justify-content: space-between;
      gap: 10px;
    }
    tbody td::before {
      content: attr(data-label);
      font-family: var(--display);
      font-weight: 700;
      font-size: 0.7rem;
      text-transform: uppercase;
      color: var(--charcoal-soft);
    }
  }
</style>
</head>
<body>

<div class="staff-bar">
  <div class="tag">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
    Staff only — orders
  </div>
  <div class="actions">
    <a href="staff-catalog.html" class="btn-light">Catalog</a>
    <a href="staff-settings.html" class="btn-light">Settings</a>
    <a href="staff-patient-lookup.html" class="btn-light">Patient lookup</a>
    <a href="order-form.html" class="btn-light">New order</a>
    <button class="btn-ghost" id="logoutBtn">Log out</button>
  </div>
</div>

<div class="wrap">
  <div class="controls">
    <input type="text" id="searchInput" placeholder="Search by order # or patient name…">
    <div class="status-filter">
      <button class="active" data-status="">All</button>
      <button data-status="ordered">Ordered</button>
      <button data-status="ready">Ready</button>
      <button data-status="claimed">Claimed</button>
    </div>
  </div>

  <div id="content">
    <div class="loading-state">Loading orders…</div>
  </div>
</div>

<script>
(function() {
  const content = document.getElementById('content');
  const searchInput = document.getElementById('searchInput');
  const statusButtons = document.querySelectorAll('.status-filter button');
  let currentStatus = '';
  let searchDebounce = null;

  function escapeHtml(str) {
    return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function itemsSummary(order) {
    const items = Array.isArray(order.order_items) ? order.order_items : [];
    if (items.length > 1) {
      const first = items[0].item_name || '';
      return `${escapeHtml(first)} +${items.length - 1} more`;
    }
    if (items.length === 1) {
      return escapeHtml(items[0].item_name || '');
    }
    // Fall back to the legacy single-item column for orders saved
    // before the order_items table existed.
    return escapeHtml(order.item_name) || '—';
  }

  async function checkAuth() {
    try {
      const resp = await fetch('/api/auth-check');
      const result = await resp.json();
      if (!result.authenticated) {
        window.location.href = 'staff-login.html?next=staff-orders.html';
      }
    } catch (e) {
      window.location.href = 'staff-login.html?next=staff-orders.html';
    }
  }

  async function loadOrders() {
    content.innerHTML = '<div class="loading-state">Loading orders…</div>';
    const params = new URLSearchParams();
    if (searchInput.value.trim()) params.set('q', searchInput.value.trim());
    if (currentStatus) params.set('status', currentStatus);

    try {
      const resp = await fetch('/api/orders?' + params.toString());
      if (resp.status === 401) {
        window.location.href = 'staff-login.html?next=staff-orders.html';
        return;
      }
      const result = await resp.json();
      if (!resp.ok || !result.ok) throw new Error(result.error || 'Could not load orders.');

      renderOrders(result.orders || []);
    } catch (err) {
      content.innerHTML = `<div class="error-state">${escapeHtml(err.message)}</div>`;
    }
  }

  function renderOrders(orders) {
    if (!orders.length) {
      content.innerHTML = '<div class="empty-state">No orders found.</div>';
      return;
    }

    const rows = orders.map(o => `
      <tr>
        <td data-label="Order #">#${escapeHtml(o.order_no)}<span class="type-tag ${o.order_type === 'non_rx' ? 'non-rx' : 'rx'}">${o.order_type === 'non_rx' ? 'Non-Rx' : escapeHtml(o.rx_subtype || 'Rx')}</span><br><a href="order-form.html?id=${o.id}" class="log-payment-btn" style="text-decoration:none; display:inline-block; margin-top:4px;">Edit</a></td>
        <td data-label="Patient">${escapeHtml(o.patient_name)}</td>
        <td data-label="Date">${escapeHtml(o.order_date) || '—'}</td>
        <td data-label="Due">${escapeHtml(o.due_date) || '—'}</td>
        <td data-label="Item / Frame">${o.order_type === 'non_rx' ? itemsSummary(o) : (escapeHtml(o.frame) || '—')}</td>
        <td data-label="Balance">
          ${o.balance ? '₱' + escapeHtml(o.balance) : '—'}
          ${o.balance && parseFloat(o.balance) > 0 ? `
            <button type="button" class="log-payment-btn" data-order-id="${o.id}" data-order-no="${escapeHtml(o.order_no)}">Log payment</button>
            <div class="payment-panel" id="paymentPanel-${o.id}">
              <div class="payment-panel-grid">
                <input type="text" class="pp-amount" placeholder="Amount ₱" inputmode="decimal">
                <select class="pp-method">
                  <option value="cash">Cash</option>
                  <option value="gcash_cc">GCash/CC</option>
                  <option value="split">Split</option>
                </select>
                <input type="text" class="pp-split-cash" placeholder="Split — Cash ₱" inputmode="decimal" style="display:none;">
                <input type="text" class="pp-split-gcash" placeholder="Split — GCash/CC ₱" inputmode="decimal" style="display:none;">
              </div>
              <div class="payment-panel-actions">
                <button type="button" class="payment-panel-save" data-order-id="${o.id}">Save payment</button>
                <span class="payment-panel-status"></span>
              </div>
            </div>
          ` : ''}
        </td>
        <td data-label="Payment">
          <select class="payment-select" data-id="${o.id}">
            <option value="unpaid" ${o.payment_status !== 'paid' ? 'selected' : ''}>Unpaid</option>
            <option value="paid" ${o.payment_status === 'paid' ? 'selected' : ''}>Paid</option>
          </select>
        </td>
        <td data-label="Status">
          <select class="status-select" data-id="${o.id}">
            <option value="ordered" ${o.status === 'ordered' ? 'selected' : ''}>Ordered</option>
            <option value="ready" ${o.status === 'ready' ? 'selected' : ''}>Ready</option>
            <option value="claimed" ${o.status === 'claimed' ? 'selected' : ''}>Claimed</option>
          </select>
        </td>
      </tr>
    `).join('');

    content.innerHTML = `
      <table>
        <thead>
          <tr>
            <th>Order #</th><th>Patient</th><th>Date</th><th>Due</th><th>Item / Frame</th><th>Balance</th><th>Payment</th><th>Status</th>
          </tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>
    `;

    content.querySelectorAll('.payment-select').forEach(sel => {
      sel.addEventListener('change', async () => {
        const id = sel.getAttribute('data-id');
        const payment_status = sel.value;
        sel.disabled = true;
        try {
          const resp = await fetch('/api/orders', {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ id, payment_status }),
          });
          const result = await resp.json();
          if (!resp.ok || !result.ok) throw new Error(result.error || 'Could not update payment status.');
        } catch (err) {
          alert(err.message || 'Could not update payment status.');
        } finally {
          sel.disabled = false;
        }
      });
    });

    content.querySelectorAll('.status-select').forEach(sel => {
      sel.addEventListener('change', async () => {
        const id = sel.getAttribute('data-id');
        const status = sel.value;
        sel.disabled = true;
        try {
          const resp = await fetch('/api/orders', {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ id, status }),
          });
          const result = await resp.json();
          if (!resp.ok || !result.ok) throw new Error(result.error || 'Could not update status.');
        } catch (err) {
          alert(err.message || 'Could not update status.');
        } finally {
          sel.disabled = false;
        }
      });
    });

    // ---- Balance payment logging ----
    content.querySelectorAll('.log-payment-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const orderId = btn.getAttribute('data-order-id');
        const panel = document.getElementById('paymentPanel-' + orderId);
        if (panel) panel.classList.toggle('open');
      });
    });

    content.querySelectorAll('.pp-method').forEach(sel => {
      sel.addEventListener('change', () => {
        const grid = sel.closest('.payment-panel-grid');
        const isSplit = sel.value === 'split';
        grid.querySelector('.pp-split-cash').style.display = isSplit ? 'block' : 'none';
        grid.querySelector('.pp-split-gcash').style.display = isSplit ? 'block' : 'none';
      });
    });

    content.querySelectorAll('.payment-panel-save').forEach(saveBtn => {
      saveBtn.addEventListener('click', async () => {
        const orderId = saveBtn.getAttribute('data-order-id');
        const panel = document.getElementById('paymentPanel-' + orderId);
        const amountEl = panel.querySelector('.pp-amount');
        const methodEl = panel.querySelector('.pp-method');
        const splitCashEl = panel.querySelector('.pp-split-cash');
        const splitGcashEl = panel.querySelector('.pp-split-gcash');
        const statusEl = panel.querySelector('.payment-panel-status');

        const amount = amountEl.value.trim();
        if (!amount || isNaN(parseFloat(amount)) || parseFloat(amount) <= 0) {
          statusEl.textContent = 'Enter a valid amount.';
          statusEl.className = 'payment-panel-status error';
          return;
        }

        saveBtn.disabled = true;
        statusEl.textContent = 'Saving…';
        statusEl.className = 'payment-panel-status';

        try {
          const resp = await fetch('/api/balance-payments', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              order_id: orderId,
              amount,
              payment_method: methodEl.value,
              split_cash: splitCashEl.value.trim(),
              split_gcash: splitGcashEl.value.trim(),
            }),
          });
          const result = await resp.json();
          if (!resp.ok || !result.ok) throw new Error(result.error || 'Could not log the payment.');

          statusEl.textContent = 'Saved.';
          statusEl.className = 'payment-panel-status success';
          setTimeout(loadOrders, 700); // refresh the list to show the updated balance
        } catch (err) {
          statusEl.textContent = err.message;
          statusEl.className = 'payment-panel-status error';
        } finally {
          saveBtn.disabled = false;
        }
      });
    });
  }

  searchInput.addEventListener('input', () => {
    clearTimeout(searchDebounce);
    searchDebounce = setTimeout(loadOrders, 350);
  });

  statusButtons.forEach(btn => {
    btn.addEventListener('click', () => {
      statusButtons.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentStatus = btn.getAttribute('data-status');
      loadOrders();
    });
  });

  document.getElementById('logoutBtn').addEventListener('click', async () => {
    await fetch('/api/staff-logout', { method: 'POST' });
    window.location.href = 'staff-login.html';
  });

  checkAuth().then(loadOrders);
})();
</script>

</body>
</html>
