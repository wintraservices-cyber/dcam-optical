<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Patient Lookup — DCAM Optical (Staff)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Sora:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --purple: #B05A9E;
    --purple-deep: #8F4680;
    --blue: #5BAFC0;
    --blue-deep: #458F9E;
    --ivory: #F7F1E8;
    --ivory-dim: #EFE6D8;
    --charcoal: #383334;
    --charcoal-soft: #4A4547;
    --line: rgba(56,51,52,0.14);
    --display: 'Plus Jakarta Sans', sans-serif;
    --body: 'Sora', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--ivory); color: var(--charcoal); font-family: var(--body); }

  .staff-bar {
    background: var(--charcoal);
    color: var(--ivory);
    padding: 14px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
  }
  .staff-bar .tag {
    font-family: var(--display);
    font-weight: 700;
    font-size: 0.82rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--blue);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .staff-bar .actions { display: flex; gap: 10px; }
  .staff-bar a, .staff-bar button {
    font-family: var(--display);
    font-weight: 600;
    font-size: 0.85rem;
    padding: 9px 18px;
    border-radius: 100px;
    border: none;
    cursor: pointer;
    text-decoration: none;
    display: inline-block;
  }
  .btn-light { background: var(--ivory); color: var(--charcoal); }
  .btn-ghost { background: transparent; color: var(--ivory); border: 1px solid rgba(247,241,232,0.4) !important; }
  .btn-ghost:hover { background: rgba(247,241,232,0.1); }

  .wrap { max-width: 900px; margin: 0 auto; padding: 32px 24px 80px; }

  .search-row {
    display: flex;
    gap: 10px;
    margin-bottom: 28px;
  }
  .search-row input {
    flex: 1;
    border: 1.5px solid var(--line);
    background: #fff;
    padding: 13px 16px;
    border-radius: 10px;
    font-family: var(--body);
    font-size: 0.95rem;
    color: var(--charcoal);
    outline: none;
  }
  .search-row input:focus { border-color: var(--blue); }
  .search-row button {
    font-family: var(--display);
    font-weight: 700;
    font-size: 0.9rem;
    padding: 13px 26px;
    border-radius: 10px;
    border: none;
    background: var(--charcoal);
    color: var(--ivory);
    cursor: pointer;
  }
  .search-row button:hover { background: var(--purple-deep); }
  .search-row button:disabled { opacity: 0.5; cursor: not-allowed; }

  .state-message {
    text-align: center;
    padding: 60px 20px;
    color: var(--charcoal-soft);
    font-size: 0.95rem;
  }
  .state-message.error { color: #B0405A; }

  .results-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }
  .results-header .count {
    font-size: 0.82rem;
    color: var(--charcoal-soft);
  }
  .back-to-list {
    background: none;
    border: none;
    color: var(--purple-deep);
    font-family: var(--display);
    font-weight: 600;
    font-size: 0.85rem;
    cursor: pointer;
    padding: 0 0 16px;
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }
  .back-to-list:hover { text-decoration: underline; }

  .patient-list {
    background: #fff;
    border-radius: 14px;
    box-shadow: 0 10px 30px rgba(56,51,52,0.06);
    overflow: hidden;
  }
  .patient-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 22px;
    border-bottom: 1px solid var(--line);
    cursor: pointer;
  }
  .patient-row:last-child { border-bottom: none; }
  .patient-row:hover { background: var(--ivory-dim); }
  .patient-row .pname {
    font-family: var(--display);
    font-weight: 700;
    font-size: 0.95rem;
    color: var(--charcoal);
  }
  .patient-row .pmeta {
    font-size: 0.82rem;
    color: var(--charcoal-soft);
    margin-top: 2px;
  }
  .patient-row .chevron { color: var(--charcoal-soft); }

  .new-patient-toggle {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: none;
    border: none;
    color: var(--purple-deep);
    font-family: var(--display);
    font-weight: 600;
    font-size: 0.85rem;
    cursor: pointer;
    padding: 0 0 20px;
  }
  .new-patient-toggle:hover { text-decoration: underline; }

  .new-patient-panel {
    background: #fff;
    border: 1.5px solid var(--line);
    border-radius: 14px;
    padding: 22px 24px;
    margin-bottom: 24px;
    display: none;
  }
  .new-patient-panel.open { display: block; }
  .new-patient-panel h3 {
    font-family: var(--display);
    font-size: 0.95rem;
    margin: 0 0 14px;
  }
  .new-patient-grid {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 12px;
    margin-bottom: 6px;
  }
  .new-patient-grid label {
    display: block;
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--charcoal-soft);
    margin-bottom: 4px;
  }
  .new-patient-grid input {
    width: 100%;
    border: 1.5px solid var(--line);
    background: #fff;
    padding: 10px 12px;
    border-radius: 8px;
    font-family: var(--body);
    font-size: 0.9rem;
    color: var(--charcoal);
    outline: none;
  }
  .new-patient-grid input:focus { border-color: var(--blue); }
  .new-patient-actions {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-top: 14px;
  }
  .new-patient-save {
    font-family: var(--display);
    font-weight: 700;
    font-size: 0.85rem;
    padding: 10px 22px;
    border-radius: 8px;
    border: none;
    background: var(--purple);
    color: var(--ivory);
    cursor: pointer;
  }
  .new-patient-save:hover { background: var(--purple-deep); }
  .new-patient-save:disabled { opacity: 0.5; cursor: not-allowed; }
  .new-patient-status { font-size: 0.85rem; }
  .new-patient-status.error { color: #B0405A; }
  .new-patient-status.success { color: #3E8E5A; }

  @media (max-width: 640px) {
    .new-patient-grid { grid-template-columns: 1fr; }
  }

  .patient-card {
    background: #fff;
    border-radius: 16px;
    padding: 28px 30px;
    box-shadow: 0 10px 30px rgba(56,51,52,0.06);
    margin-bottom: 24px;
  }
  .patient-card h2 {
    font-family: var(--display);
    font-weight: 800;
    font-size: 1.4rem;
    color: var(--charcoal);
  }
  .patient-meta {
    margin-top: 8px;
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
    font-size: 0.88rem;
    color: var(--charcoal-soft);
  }
  .patient-meta strong { color: var(--charcoal); font-weight: 600; }

  .patient-card-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
  }
  .edit-patient-btn {
    background: none;
    border: 1px solid var(--line);
    border-radius: 100px;
    padding: 6px 14px;
    font-family: var(--display);
    font-weight: 600;
    font-size: 0.78rem;
    color: var(--purple-deep);
    cursor: pointer;
    white-space: nowrap;
  }
  .edit-patient-btn:hover { background: var(--ivory-dim); }

  .edit-patient-form {
    display: none;
    margin-top: 14px;
    padding-top: 14px;
    border-top: 1px solid var(--line);
  }
  .edit-patient-form.open { display: block; }
  .edit-patient-grid {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 10px;
    margin-bottom: 10px;
  }
  .edit-patient-grid label {
    display: block;
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--charcoal-soft);
    margin-bottom: 4px;
  }
  .edit-patient-grid input {
    width: 100%;
    border: 1.5px solid var(--line);
    padding: 9px 11px;
    border-radius: 8px;
    font-family: var(--body);
    font-size: 0.88rem;
  }
  .edit-patient-grid input:focus { outline: none; border-color: var(--blue); }
  .edit-patient-actions {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .edit-patient-save {
    font-family: var(--display);
    font-weight: 700;
    font-size: 0.82rem;
    padding: 8px 18px;
    border-radius: 8px;
    border: none;
    background: var(--purple);
    color: var(--ivory);
    cursor: pointer;
  }
  .edit-patient-status { font-size: 0.8rem; }
  .edit-patient-status.error { color: #B0405A; }
  .edit-patient-status.success { color: #3E8E5A; }

  .move-record-btn {
    background: none;
    border: none;
    color: var(--purple-deep);
    font-family: var(--display);
    font-weight: 600;
    font-size: 0.72rem;
    cursor: pointer;
    padding: 0;
    margin-left: 10px;
    text-decoration: underline;
  }
  .move-record-panel {
    display: none;
    margin-top: 8px;
    background: var(--ivory-dim);
    border-radius: 8px;
    padding: 10px;
  }
  .move-record-panel.open { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .move-record-panel input {
    flex: 1;
    min-width: 160px;
    padding: 6px 9px;
    border: 1px solid var(--line);
    border-radius: 6px;
    font-family: var(--body);
    font-size: 0.82rem;
  }
  .move-record-save {
    font-family: var(--display);
    font-weight: 700;
    font-size: 0.76rem;
    padding: 6px 12px;
    border-radius: 6px;
    border: none;
    background: var(--purple);
    color: var(--ivory);
    cursor: pointer;
  }
  .move-record-status { font-size: 0.76rem; }
  .move-record-status.error { color: #B0405A; }
  .move-record-status.success { color: #3E8E5A; }

  .history-section { margin-bottom: 28px; }
  .history-section h3 {
    font-family: var(--display);
    font-weight: 700;
    font-size: 0.85rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--blue-deep);
    margin-bottom: 14px;
  }

  .history-list { display: flex; flex-direction: column; gap: 10px; }
  .history-item {
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 16px 18px;
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 6px 16px;
    align-items: start;
  }
  .history-item .primary {
    font-family: var(--display);
    font-weight: 600;
    font-size: 0.92rem;
    color: var(--charcoal);
  }
  .history-item .secondary {
    font-size: 0.82rem;
    color: var(--charcoal-soft);
    grid-column: 1 / -1;
  }
  .history-item .date-badge {
    font-size: 0.75rem;
    color: var(--charcoal-soft);
    white-space: nowrap;
  }

  .rx-spec-table {
    grid-column: 1 / -1;
    width: 100%;
    border-collapse: collapse;
    margin-top: 8px;
    font-size: 0.8rem;
  }
  .rx-spec-table th, .rx-spec-table td {
    text-align: center;
    padding: 5px 8px;
    border: 1px solid var(--line);
  }
  .rx-spec-table th {
    font-family: var(--display);
    font-weight: 700;
    font-size: 0.68rem;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: var(--charcoal-soft);
    background: var(--ivory-dim);
  }
  .rx-spec-table td:first-child, .rx-spec-table th:first-child {
    text-align: left;
    font-weight: 600;
    color: var(--charcoal);
  }
  .rx-spec-meta {
    grid-column: 1 / -1;
    font-size: 0.78rem;
    color: var(--charcoal-soft);
    margin-top: 4px;
  }
  .status-pill {
    display: inline-block;
    font-family: var(--display);
    font-weight: 700;
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    padding: 3px 10px;
    border-radius: 100px;
    margin-left: 8px;
  }
  .status-pill.ordered { background: rgba(91,175,192,0.14); color: var(--blue-deep); }
  .status-pill.ready { background: rgba(176,90,158,0.14); color: var(--purple-deep); }
  .status-pill.claimed { background: rgba(56,51,52,0.1); color: var(--charcoal-soft); }

  .empty-sub { font-size: 0.85rem; color: var(--charcoal-soft); font-style: italic; }

  .payment-row {
    grid-column: 1 / -1;
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 8px;
    padding-top: 8px;
    border-top: 1px solid var(--line);
  }
  .payment-row-label {
    font-family: var(--display);
    font-weight: 700;
    font-size: 0.68rem;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: var(--charcoal-soft);
  }
  select.payment-select {
    font-family: var(--body);
    font-size: 0.8rem;
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 4px 8px;
    background: #fff;
    color: var(--charcoal);
  }
</style>
</head>
<body>

<div class="staff-bar">
  <div class="tag">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
    Staff only — patient lookup
  </div>
  <div class="actions">
    <a href="staff-orders.html" class="btn-light">All orders</a>
    <a href="staff-catalog.html" class="btn-light">Catalog</a>
    <a href="staff-reports.html" class="btn-light">Reports</a>
    <a href="staff-settings.html" class="btn-light">Settings</a>
    <a href="order-form.html" class="btn-light">New order</a>
    <button class="btn-ghost" id="logoutBtn">Log out</button>
  </div>
</div>

<div class="wrap">
  <button type="button" class="new-patient-toggle" id="newPatientToggle">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>
    Add new patient
  </button>

  <div class="new-patient-panel" id="newPatientPanel">
    <h3>New patient</h3>
    <div class="new-patient-grid">
      <div>
        <label>Name *</label>
        <input type="text" id="newPatientName" placeholder="Full name">
      </div>
      <div>
        <label>Phone *</label>
        <input type="text" id="newPatientPhone" placeholder="09xx xxx xxxx" inputmode="tel">
      </div>
      <div>
        <label>Email (optional)</label>
        <input type="email" id="newPatientEmail" placeholder="name@email.com">
      </div>
    </div>
    <div class="new-patient-actions">
      <button type="button" class="new-patient-save" id="newPatientSave">Save patient</button>
      <span class="new-patient-status" id="newPatientStatus"></span>
    </div>
  </div>

  <div class="search-row">
    <input type="text" id="phoneInput" placeholder="Search by name or phone number…">
    <button id="searchBtn">Search</button>
  </div>

  <div id="content">
    <div class="state-message">Loading patients…</div>
  </div>
</div>

<script>
(function() {
  const phoneInput = document.getElementById('phoneInput');
  const searchBtn = document.getElementById('searchBtn');
  const content = document.getElementById('content');

  function escapeHtml(str) {
    return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function itemsSummary(order) {
    const items = Array.isArray(order.order_items) ? order.order_items : [];
    if (items.length > 1) {
      const names = items.map(i => i.item_name).filter(Boolean).join(', ');
      return `Items: ${escapeHtml(names)}`;
    }
    if (items.length === 1) {
      return `Item: ${escapeHtml(items[0].item_name || '')}`;
    }
    return order.item_name ? `Item: ${escapeHtml(order.item_name)}` : '';
  }

  async function checkAuth() {
    try {
      const resp = await fetch('/api/staff-auth');
      const result = await resp.json();
      if (!result.authenticated) {
        window.location.href = 'staff-login.html?next=staff-patient-lookup.html';
      }
    } catch (e) {
      window.location.href = 'staff-login.html?next=staff-patient-lookup.html';
    }
  }
  checkAuth();

  // ---- Add new patient (direct creation, not via intake/order) ----
  const newPatientToggle = document.getElementById('newPatientToggle');
  const newPatientPanel = document.getElementById('newPatientPanel');
  const newPatientName = document.getElementById('newPatientName');
  const newPatientPhone = document.getElementById('newPatientPhone');
  const newPatientEmail = document.getElementById('newPatientEmail');
  const newPatientSave = document.getElementById('newPatientSave');
  const newPatientStatus = document.getElementById('newPatientStatus');

  newPatientToggle.addEventListener('click', () => {
    const isOpen = newPatientPanel.classList.toggle('open');
    if (isOpen) newPatientName.focus();
  });

  newPatientSave.addEventListener('click', async () => {
    const name = newPatientName.value.trim();
    const phone = newPatientPhone.value.trim();
    const email = newPatientEmail.value.trim();

    newPatientStatus.textContent = '';
    newPatientStatus.className = 'new-patient-status';

    if (!name || !phone) {
      newPatientStatus.textContent = 'Name and phone are required.';
      newPatientStatus.className = 'new-patient-status error';
      return;
    }

    newPatientSave.disabled = true;
    newPatientStatus.textContent = 'Saving…';

    try {
      const resp = await fetch('/api/patients', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, phone, email }),
      });
      if (resp.status === 401) {
        window.location.href = 'staff-login.html?next=staff-patient-lookup.html';
        return;
      }
      const result = await resp.json();
      if (!resp.ok || !result.ok) throw new Error(result.error || 'Could not save this patient.');

      newPatientStatus.textContent = 'Saved.';
      newPatientStatus.className = 'new-patient-status success';

      // Jump straight into their (likely empty) history so staff get
      // visual confirmation the record was created.
      newPatientName.value = '';
      newPatientPhone.value = '';
      newPatientEmail.value = '';
      viewPatient(result.patient.phone);

      setTimeout(() => {
        newPatientPanel.classList.remove('open');
        newPatientStatus.textContent = '';
      }, 1200);
    } catch (err) {
      newPatientStatus.textContent = err.message;
      newPatientStatus.className = 'new-patient-status error';
    } finally {
      newPatientSave.disabled = false;
    }
  });

  const REASON_LABELS = {
    comprehensive: 'Comprehensive eye exam',
    checkup: 'Check up',
    contacts: 'Contact lens fitting',
    frames: 'Frame styling / new glasses',
    urgent: 'Urgent concern',
    unsure: 'Not sure — help figure it out',
  };

  function formatDate(iso) {
    if (!iso) return '';
    try {
      return new Date(iso).toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' });
    } catch (e) { return iso; }
  }

  async function search() {
    const term = phoneInput.value.trim();

    searchBtn.disabled = true;
    content.innerHTML = '<div class="state-message">Loading…</div>';

    try {
      const resp = await fetch('/api/patients?q=' + encodeURIComponent(term));
      if (resp.status === 401) {
        window.location.href = 'staff-login.html?next=staff-patient-lookup.html';
        return;
      }
      const result = await resp.json();
      if (!resp.ok || !result.ok) throw new Error(result.error || 'Could not load patients.');

      renderPatientList(result.patients || [], term);
    } catch (err) {
      content.innerHTML = `<div class="state-message error">${escapeHtml(err.message)}</div>`;
    } finally {
      searchBtn.disabled = false;
    }
  }

  function renderPatientList(patients, term) {
    if (patients.length === 0) {
      const msg = term
        ? 'No patients match that search.'
        : 'No patients on file yet.';
      content.innerHTML = `<div class="state-message">${escapeHtml(msg)}</div>`;
      return;
    }

    const countLabel = term
      ? `${patients.length} match${patients.length === 1 ? '' : 'es'}`
      : `${patients.length} patient${patients.length === 1 ? '' : 's'}`;

    content.innerHTML = `
      <div class="results-header"><span class="count">${escapeHtml(countLabel)}</span></div>
      <div class="patient-list">
        ${patients.map(p => `
          <div class="patient-row" data-phone="${escapeHtml(p.phone)}">
            <div>
              <div class="pname">${escapeHtml(p.name || 'Unknown')}</div>
              <div class="pmeta">${escapeHtml(p.phone || '')}${p.email ? ' · ' + escapeHtml(p.email) : ''}</div>
            </div>
            <span class="chevron">›</span>
          </div>
        `).join('')}
      </div>
    `;

    content.querySelectorAll('.patient-row').forEach(row => {
      row.addEventListener('click', () => viewPatient(row.dataset.phone));
    });
  }

  async function viewPatient(phone) {
    content.innerHTML = '<div class="state-message">Loading patient…</div>';
    try {
      const resp = await fetch('/api/patients?phone=' + encodeURIComponent(phone));
      if (resp.status === 401) {
        window.location.href = 'staff-login.html?next=staff-patient-lookup.html';
        return;
      }
      const result = await resp.json();
      if (!resp.ok || !result.ok) throw new Error(result.error || 'Could not look up this patient.');

      renderResult(result);

      const backBtn = document.createElement('button');
      backBtn.type = 'button';
      backBtn.className = 'back-to-list';
      backBtn.innerHTML = '‹ Back to patient list';
      backBtn.addEventListener('click', search);
      content.prepend(backBtn);
    } catch (err) {
      content.innerHTML = `<div class="state-message error">${escapeHtml(err.message)}</div>`;
    }
  }

  function renderResult({ patient, intakes, orders }) {
    if (!patient) {
      content.innerHTML = '<div class="state-message">No patient found with that phone number yet — they may not have submitted an intake form or had an order placed.</div>';
      return;
    }

    const intakeHtml = intakes.length
      ? intakes.map(i => `
          <div class="history-item">
            <div class="primary">${escapeHtml(REASON_LABELS[i.reason] || i.reason || 'Intake request')}</div>
            <div class="date-badge">${formatDate(i.created_at)}</div>
            <div class="secondary">${i.patient_type === 'returning' ? 'Returning patient' : 'New patient'}${i.pref_date ? ' · Preferred: ' + escapeHtml(i.pref_date) : ''}${i.notes ? ' · ' + escapeHtml(i.notes) : ''}</div>
            <div class="payment-row">
              <span class="payment-row-label">Payment:</span>
              <select class="payment-select" data-kind="intake" data-id="${i.id}">
                <option value="unpaid" ${i.payment_status !== 'paid' ? 'selected' : ''}>Unpaid</option>
                <option value="paid" ${i.payment_status === 'paid' ? 'selected' : ''}>Paid</option>
              </select>
              <button type="button" class="move-record-btn" data-kind="intake" data-id="${i.id}">Move to different patient</button>
            </div>
            <div class="move-record-panel" id="movePanel-intake-${i.id}">
              <input type="text" class="move-target-input" placeholder="New patient's phone number">
              <button type="button" class="move-record-save" data-kind="intake" data-id="${i.id}">Move</button>
              <span class="move-record-status"></span>
            </div>
          </div>
        `).join('')
      : '<p class="empty-sub">No intake requests on file.</p>';

    function rxSpecTable(o) {
      // Only meaningful for Rx orders, and only worth showing if at
      // least one spec field was actually filled in -- an Rx order
      // saved with an empty grid (e.g. a frame-only job) shouldn't
      // render a table of blank dashes.
      const hasAnySpec = [
        o.rx_r_sph, o.rx_r_cyl, o.rx_r_axis, o.rx_r_prism, o.rx_r_base,
        o.rx_l_sph, o.rx_l_cyl, o.rx_l_axis, o.rx_l_prism, o.rx_l_base,
      ].some(v => v);
      if (!hasAnySpec) return '';

      const cell = (v) => escapeHtml(v) || '—';
      const rows = `
        <tr><th>Eye</th><th>SPH</th><th>CYL</th><th>AXIS</th><th>PRISM</th><th>BASE</th>${(o.add_r || o.add_l) ? '<th>ADD</th>' : ''}${(o.seg_ht_r || o.seg_ht_l) ? '<th>Seg Ht</th>' : ''}</tr>
        <tr><td>OD (R)</td><td>${cell(o.rx_r_sph)}</td><td>${cell(o.rx_r_cyl)}</td><td>${cell(o.rx_r_axis)}</td><td>${cell(o.rx_r_prism)}</td><td>${cell(o.rx_r_base)}</td>${(o.add_r || o.add_l) ? `<td>${cell(o.add_r)}</td>` : ''}${(o.seg_ht_r || o.seg_ht_l) ? `<td>${cell(o.seg_ht_r)}</td>` : ''}</tr>
        <tr><td>OS (L)</td><td>${cell(o.rx_l_sph)}</td><td>${cell(o.rx_l_cyl)}</td><td>${cell(o.rx_l_axis)}</td><td>${cell(o.rx_l_prism)}</td><td>${cell(o.rx_l_base)}</td>${(o.add_r || o.add_l) ? `<td>${cell(o.add_l)}</td>` : ''}${(o.seg_ht_r || o.seg_ht_l) ? `<td>${cell(o.seg_ht_l)}</td>` : ''}</tr>
      `;

      const pdText = o.pd_mode === 'single'
        ? (o.pd_r ? `PD: ${escapeHtml(o.pd_r)}` : '')
        : ((o.pd_r || o.pd_l) ? `PD: R ${escapeHtml(o.pd_r) || '—'} / L ${escapeHtml(o.pd_l) || '—'}` : '');
      const metaParts = [
        o.lens_type ? `Lens type: ${escapeHtml(o.lens_type)}` : '',
        o.lens_material ? `Material: ${escapeHtml(o.lens_material)}` : '',
        pdText,
      ].filter(Boolean).join(' · ');

      return `
        <table class="rx-spec-table"><tbody>${rows}</tbody></table>
        ${metaParts ? `<div class="rx-spec-meta">${metaParts}</div>` : ''}
      `;
    }

    const ordersHtml = orders.length
      ? orders.map(o => `
          <div class="history-item">
            <div class="primary">Order #${escapeHtml(o.order_no)}<span class="status-pill ${o.order_type === 'non_rx' ? 'ordered' : 'ready'}" style="opacity:0.85;">${o.order_type === 'non_rx' ? 'Non-Rx' : escapeHtml(o.rx_subtype || 'Rx')}</span><span class="status-pill ${escapeHtml(o.status)}">${escapeHtml(o.status)}</span></div>
            <div class="date-badge">${formatDate(o.created_at)}</div>
            <div class="secondary">${o.order_type === 'non_rx'
              ? itemsSummary(o)
              : (o.frame ? 'Frame: ' + escapeHtml(o.frame) : '') + (o.lens_type ? ' · ' + escapeHtml(o.lens_type) : '')
            }${o.balance ? ' · Balance: ₱' + escapeHtml(o.balance) : ''}</div>
            ${o.order_type !== 'non_rx' ? rxSpecTable(o) : ''}
            <div class="payment-row">
              <span class="payment-row-label">Payment:</span>
              <select class="payment-select" data-kind="order" data-id="${o.id}">
                <option value="unpaid" ${o.payment_status !== 'paid' ? 'selected' : ''}>Unpaid</option>
                <option value="paid" ${o.payment_status === 'paid' ? 'selected' : ''}>Paid</option>
              </select>
              <a href="order-form.html?id=${o.id}" class="move-record-btn" style="text-decoration:underline;">Edit order</a>
              <button type="button" class="move-record-btn" data-kind="order" data-id="${o.id}">Move to different patient</button>
            </div>
            <div class="move-record-panel" id="movePanel-order-${o.id}">
              <input type="text" class="move-target-input" placeholder="New patient's phone number">
              <button type="button" class="move-record-save" data-kind="order" data-id="${o.id}">Move</button>
              <span class="move-record-status"></span>
            </div>
          </div>
        `).join('')
      : '<p class="empty-sub">No orders on file.</p>';

    content.innerHTML = `
      <div class="patient-card">
        <div class="patient-card-header">
          <div>
            <h2>${escapeHtml(patient.name)}</h2>
            <div class="patient-meta">
              <span><strong>Phone:</strong> ${escapeHtml(patient.phone)}</span>
              ${patient.email ? `<span><strong>Email:</strong> ${escapeHtml(patient.email)}</span>` : ''}
              <span><strong>Patient since:</strong> ${formatDate(patient.created_at)}</span>
            </div>
          </div>
          <button type="button" class="edit-patient-btn" id="editPatientBtn">Edit</button>
        </div>
        <div class="edit-patient-form" id="editPatientForm">
          <div class="edit-patient-grid">
            <div>
              <label>Name</label>
              <input type="text" id="editName" value="${escapeHtml(patient.name)}">
            </div>
            <div>
              <label>Phone</label>
              <input type="text" id="editPhone" value="${escapeHtml(patient.phone)}">
            </div>
            <div>
              <label>Email</label>
              <input type="email" id="editEmail" value="${escapeHtml(patient.email || '')}">
            </div>
          </div>
          <div class="edit-patient-actions">
            <button type="button" class="edit-patient-save" id="editPatientSave">Save changes</button>
            <span class="edit-patient-status" id="editPatientStatus"></span>
          </div>
        </div>
      </div>

      <div class="history-section">
        <h3>Intake requests (${intakes.length})</h3>
        <div class="history-list">${intakeHtml}</div>
      </div>

      <div class="history-section">
        <h3>Orders (${orders.length})</h3>
        <div class="history-list">${ordersHtml}</div>
      </div>
    `;

    content.querySelectorAll('.payment-select').forEach(sel => {
      sel.addEventListener('change', async () => {
        const kind = sel.getAttribute('data-kind');
        const id = sel.getAttribute('data-id');
        const payment_status = sel.value;
        sel.disabled = true;
        try {
          const endpoint = kind === 'intake' ? '/api/intake-payment' : '/api/orders';
          const resp = await fetch(endpoint, {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ id, payment_status }),
          });
          const result = await resp.json();
          if (!resp.ok || !result.ok) throw new Error(result.error || 'Could not update payment status.');
        } catch (err) {
          alert(err.message || 'Could not update payment status.');
        } finally {
          sel.disabled = false;
        }
      });
    });

    // ---- Edit patient info ----
    const editBtn = document.getElementById('editPatientBtn');
    const editForm = document.getElementById('editPatientForm');
    editBtn.addEventListener('click', () => {
      editForm.classList.toggle('open');
    });

    document.getElementById('editPatientSave').addEventListener('click', async () => {
      const nameEl = document.getElementById('editName');
      const phoneEl = document.getElementById('editPhone');
      const emailEl = document.getElementById('editEmail');
      const statusEl = document.getElementById('editPatientStatus');
      const saveBtn = document.getElementById('editPatientSave');

      const name = nameEl.value.trim();
      const phone = phoneEl.value.trim();
      if (!name || !phone) {
        statusEl.textContent = 'Name and phone are required.';
        statusEl.className = 'edit-patient-status error';
        return;
      }

      saveBtn.disabled = true;
      statusEl.textContent = 'Saving…';
      statusEl.className = 'edit-patient-status';

      try {
        const resp = await fetch('/api/patients', {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id: patient.id, name, phone, email: emailEl.value.trim() }),
        });
        const result = await resp.json();
        if (!resp.ok || !result.ok) throw new Error(result.error || 'Could not save changes.');

        statusEl.textContent = 'Saved.';
        statusEl.className = 'edit-patient-status success';
        // Reload this patient's view so the header reflects the update
        // (a phone change also means future searches use the new number).
        setTimeout(() => viewPatient(result.patient.phone), 700);
      } catch (err) {
        statusEl.textContent = err.message;
        statusEl.className = 'edit-patient-status error';
      } finally {
        saveBtn.disabled = false;
      }
    });

    // ---- Move a record (intake or order) to a different patient ----
    content.querySelectorAll('.move-record-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const kind = btn.getAttribute('data-kind');
        const id = btn.getAttribute('data-id');
        const panel = document.getElementById(`movePanel-${kind}-${id}`);
        if (panel) panel.classList.toggle('open');
      });
    });

    content.querySelectorAll('.move-record-save').forEach(saveBtn => {
      saveBtn.addEventListener('click', async () => {
        const kind = saveBtn.getAttribute('data-kind');
        const id = saveBtn.getAttribute('data-id');
        const panel = document.getElementById(`movePanel-${kind}-${id}`);
        const targetInput = panel.querySelector('.move-target-input');
        const statusEl = panel.querySelector('.move-record-status');
        const targetPhone = targetInput.value.trim();

        if (!targetPhone) {
          statusEl.textContent = 'Enter the destination phone number.';
          statusEl.className = 'move-record-status error';
          return;
        }

        saveBtn.disabled = true;
        statusEl.textContent = 'Looking up patient…';
        statusEl.className = 'move-record-status';

        try {
          // Resolve the phone number to a patient id first, using the
          // same search endpoint the rest of this page already uses.
          const lookupResp = await fetch('/api/patients?q=' + encodeURIComponent(targetPhone));
          const lookupResult = await lookupResp.json();
          if (!lookupResp.ok || !lookupResult.ok) throw new Error('Could not look up that phone number.');
          const targetPatient = (lookupResult.patients || []).find(p => p.phone === targetPhone.replace(/[^\d+]/g, ''));
          if (!targetPatient) {
            throw new Error('No patient found with that phone number.');
          }
          if (targetPatient.id === patient.id) {
            throw new Error('That is the same patient this record already belongs to.');
          }

          statusEl.textContent = 'Moving…';
          const resp = await fetch('/api/patients?action=reassign', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ record_type: kind, record_id: id, new_patient_id: targetPatient.id }),
          });
          const result = await resp.json();
          if (!resp.ok || !result.ok) throw new Error(result.error || 'Could not move this record.');

          statusEl.textContent = `Moved to ${targetPatient.name}.`;
          statusEl.className = 'move-record-status success';
          // Refresh this patient's view -- the moved record will now be
          // gone from this list, confirming the move worked.
          setTimeout(() => viewPatient(patient.phone), 900);
        } catch (err) {
          statusEl.textContent = err.message;
          statusEl.className = 'move-record-status error';
        } finally {
          saveBtn.disabled = false;
        }
      });
    });
  }

  searchBtn.addEventListener('click', search);
  search(); // initial load — empty query returns the full patient list
  phoneInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') search(); });

  document.getElementById('logoutBtn').addEventListener('click', async () => {
    await fetch('/api/staff-auth?action=logout', { method: 'POST' });
    window.location.href = 'staff-login.html';
  });
})();
</script>

</body>
</html>
