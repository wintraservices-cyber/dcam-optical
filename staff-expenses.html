<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Expenses — DCAM Optical (Staff)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Sora:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --purple: #B05A9E;
    --purple-deep: #8F4680;
    --blue: #5BAFC0;
    --blue-deep: #458F9E;
    --ivory: #F7F1E8;
    --ivory-dim: #EFE6D8;
    --charcoal: #383334;
    --charcoal-soft: #4A4547;
    --line: rgba(56,51,52,0.14);
    --display: 'Plus Jakarta Sans', sans-serif;
    --body: 'Sora', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--ivory); color: var(--charcoal); font-family: var(--body); }

  .staff-bar {
    background: var(--charcoal);
    color: var(--ivory);
    padding: 14px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
  }
  .staff-bar .tag {
    font-family: var(--display);
    font-weight: 700;
    font-size: 0.82rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--blue);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .staff-bar .actions { display: flex; gap: 10px; flex-wrap: wrap; }
  .staff-bar a, .staff-bar button {
    font-family: var(--display);
    font-weight: 600;
    font-size: 0.85rem;
    padding: 9px 18px;
    border-radius: 100px;
    border: none;
    cursor: pointer;
    text-decoration: none;
    display: inline-block;
  }
  .btn-light { background: var(--ivory); color: var(--charcoal); }
  .btn-ghost { background: transparent; color: var(--ivory); border: 1px solid rgba(247,241,232,0.4) !important; }
  .btn-ghost:hover { background: rgba(247,241,232,0.1); }

  .wrap { max-width: 1040px; margin: 0 auto; padding: 32px 24px 80px; }

  .entry-card {
    background: #fff;
    border-radius: 16px;
    padding: 20px 22px;
    margin-bottom: 22px;
    box-shadow: 0 10px 30px rgba(56,51,52,0.06);
  }
  .entry-card h2 {
    font-family: var(--display);
    font-size: 1rem;
    margin-bottom: 14px;
  }
  .entry-grid {
    display: grid;
    grid-template-columns: 140px 1fr 1fr 140px auto;
    gap: 10px;
    align-items: end;
  }
  .entry-grid .field label {
    display: block;
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--charcoal-soft);
    margin-bottom: 4px;
    font-family: var(--display);
    font-weight: 700;
  }
  .entry-grid input, .entry-grid select {
    width: 100%;
    border: 1.5px solid var(--line);
    background: #fff;
    padding: 10px 12px;
    border-radius: 8px;
    font-family: var(--body);
    font-size: 0.9rem;
    color: var(--charcoal);
    outline: none;
  }
  .entry-grid input:focus, .entry-grid select:focus { border-color: var(--blue); }
  .entry-add-btn {
    font-family: var(--display);
    font-weight: 700;
    font-size: 0.85rem;
    padding: 10px 20px;
    border-radius: 8px;
    border: none;
    background: var(--purple);
    color: #fff;
    cursor: pointer;
    white-space: nowrap;
  }
  .entry-add-btn:disabled { opacity: 0.6; cursor: not-allowed; }
  .entry-status {
    font-size: 0.82rem;
    margin-top: 10px;
  }
  .entry-status.error { color: #B0405A; }
  .entry-status.success { color: #3E8E5A; }

  .controls { margin-bottom: 18px; }

  .total-tile {
    background: var(--charcoal);
    color: var(--ivory);
    border-radius: 12px;
    padding: 14px 20px;
    margin-bottom: 18px;
    display: flex;
    align-items: baseline;
    gap: 10px;
  }
  .total-tile .label {
    font-family: var(--display);
    font-weight: 700;
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--blue);
  }
  .total-tile .value {
    font-family: var(--display);
    font-weight: 800;
    font-size: 1.4rem;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    background: #fff;
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 10px 30px rgba(56,51,52,0.06);
  }
  thead th {
    text-align: left;
    font-family: var(--display);
    font-weight: 700;
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--charcoal-soft);
    background: var(--ivory-dim);
    padding: 12px 16px;
  }
  tbody td {
    padding: 12px 16px;
    border-top: 1px solid var(--line);
    font-size: 0.9rem;
  }
  tbody tr:hover { background: var(--ivory-dim); }

  .type-chip {
    display: inline-block;
    font-family: var(--display);
    font-weight: 700;
    font-size: 0.68rem;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    padding: 3px 10px;
    border-radius: 100px;
    background: rgba(176,90,158,0.14);
    color: var(--purple-deep);
  }

  .row-actions { display: flex; gap: 6px; flex-wrap: wrap; }
  .edit-btn, .delete-btn, .save-edit-btn, .cancel-edit-btn {
    font-family: var(--display);
    font-weight: 600;
    font-size: 0.72rem;
    padding: 4px 10px;
    border-radius: 100px;
    background: #fff;
    cursor: pointer;
  }
  .edit-btn { border: 1px solid var(--purple); color: var(--purple-deep); }
  .edit-btn:hover { background: rgba(176,90,158,0.08); }
  .delete-btn { border: 1px solid #B0405A; color: #B0405A; }
  .delete-btn:hover { background: rgba(176,64,90,0.08); }
  .save-edit-btn { border: 1px solid #3E8E5A; color: #3E8E5A; }
  .save-edit-btn:hover { background: rgba(62,142,90,0.08); }
  .cancel-edit-btn { border: 1px solid var(--line); color: var(--charcoal-soft); }
  .cancel-edit-btn:hover { background: var(--ivory-dim); }

  .edit-row input, .edit-row select {
    width: 100%;
    border: 1.5px solid var(--line);
    background: #fff;
    padding: 6px 8px;
    border-radius: 6px;
    font-family: var(--body);
    font-size: 0.85rem;
    color: var(--charcoal);
    outline: none;
  }
  .edit-row input:focus, .edit-row select:focus { border-color: var(--blue); }

  .not-admin-state { text-align: center; padding: 80px 20px; color: var(--charcoal-soft); }

  .tab-bar {
    display: flex;
    gap: 8px;
    margin-bottom: 22px;
    border-bottom: 1.5px solid var(--line);
  }
  .tab-btn {
    font-family: var(--display);
    font-weight: 700;
    font-size: 0.88rem;
    padding: 10px 18px;
    border: none;
    background: transparent;
    color: var(--charcoal-soft);
    cursor: pointer;
    border-bottom: 2.5px solid transparent;
    margin-bottom: -1.5px;
  }
  .tab-btn.active { color: var(--purple-deep); border-bottom-color: var(--purple); }
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  .source-chip {
    display: inline-block;
    font-family: var(--display);
    font-weight: 700;
    font-size: 0.68rem;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    padding: 3px 10px;
    border-radius: 100px;
    background: rgba(91,175,192,0.16);
    color: var(--blue-deep);
  }

  .totals-row { display: flex; gap: 14px; flex-wrap: wrap; margin-bottom: 18px; }
  .totals-row .total-tile { margin-bottom: 0; flex: 1; min-width: 160px; }

  .empty-state, .loading-state, .error-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--charcoal-soft);
    font-size: 0.95rem;
  }
  .error-state { color: #B0405A; }

  @media (max-width: 720px) {
    .entry-grid { grid-template-columns: 1fr 1fr; }
    .entry-grid .entry-add-btn { grid-column: 1 / -1; }
    table, thead, tbody, th, td, tr { display: block; }
    thead { display: none; }
    tbody tr {
      border: 1px solid var(--line);
      border-radius: 10px;
      margin-bottom: 12px;
      padding: 10px 14px;
    }
    tbody td {
      border: none;
      padding: 6px 0;
      display: flex;
      justify-content: space-between;
      gap: 10px;
    }
    tbody td::before {
      content: attr(data-label);
      font-family: var(--display);
      font-weight: 700;
      font-size: 0.7rem;
      text-transform: uppercase;
      color: var(--charcoal-soft);
    }
  }
</style>
<script type="module" src="/analytics.js"></script>
</head>
<body>

<div class="staff-bar">
  <div class="tag">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
    Staff only — expenses
  </div>
  <div class="actions">
    <a href="staff-dashboard.html" class="btn-light">Dashboard</a>
    <a href="staff-orders.html" class="btn-light">Orders</a>
    <a href="staff-catalog.html" class="btn-light">Catalog</a>
    <a href="staff-reports.html" class="btn-light">Reports</a>
    <a href="staff-cashflow.html" class="btn-light nav-admin-only">Cash Position</a>
    <a href="staff-settings.html" class="btn-light nav-admin-only">Settings</a>
    <a href="staff-patient-lookup.html" class="btn-light">Patient lookup</a>
    <button class="btn-ghost" id="logoutBtn">Log out</button>
  </div>
</div>

<div class="wrap" id="mainWrap" style="display:none;">
  <div class="tab-bar">
    <button type="button" class="tab-btn active" id="tabBtnExpenses">Expenses</button>
    <button type="button" class="tab-btn" id="tabBtnWithdrawal">Withdrawal</button>
  </div>

  <div class="tab-panel active" id="panelExpenses">
    <div id="entrySection">
      <div class="loading-state">Loading…</div>
    </div>

    <div class="controls" id="periodFilterMount"></div>

    <div class="total-tile">
      <span class="label">Total for this range</span>
      <span class="value" id="totalValue">₱0.00</span>
    </div>

    <div id="content">
      <div class="loading-state">Loading expenses…</div>
    </div>
  </div>

  <div class="tab-panel" id="panelWithdrawal">
    <div id="withdrawalEntrySection">
      <div class="loading-state">Loading…</div>
    </div>

    <div class="controls" id="withdrawalPeriodFilterMount"></div>

    <div class="totals-row">
      <div class="total-tile">
        <span class="label">Total</span>
        <span class="value" id="withdrawalTotalValue">₱0.00</span>
      </div>
      <div class="total-tile">
        <span class="label">Cash</span>
        <span class="value" id="withdrawalCashValue">₱0.00</span>
      </div>
      <div class="total-tile">
        <span class="label">Checking</span>
        <span class="value" id="withdrawalCheckValue">₱0.00</span>
      </div>
    </div>

    <div id="withdrawalContent">
      <div class="loading-state">Loading withdrawals…</div>
    </div>
  </div>
</div>

<div class="not-admin-state" id="notAdminState" style="display:none;">
  <p>This page requires an admin account.</p>
</div>

<script src="period-filter.js"></script>
<script>
(function() {
  const entrySection = document.getElementById('entrySection');
  const content = document.getElementById('content');
  const totalValue = document.getElementById('totalValue');
  // Expenses default to "Last 7 days" -- unlike Orders (usually browsed
  // in full or searched by number), this page's main use is "what did we
  // spend recently", so a recent-by-default window is more useful.
  const periodFilter = PeriodFilter.mount(document.getElementById('periodFilterMount'), {
    defaultPreset: 'last7',
    onChange: () => loadExpenses(),
  });

  let isAdmin = false;
  let expenseTypes = [];

  function escapeHtml(str) {
    return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }
  function escapeHtmlAttr(str) {
    return String(str || '').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }
  function todayIso() {
    const d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }

  // Expenses (and Withdrawal) are admin-only end to end -- staff don't
  // get a nav button to this page, and this gate blocks anyone who
  // reaches it directly by URL, same "not-admin-state" pattern as
  // staff-settings.html. There's no partial staff access anymore.
  async function checkAuth() {
    try {
      const resp = await fetch('/api/staff-auth');
      const result = await resp.json();
      if (!result.authenticated) {
        window.location.href = 'staff-login.html?next=staff-expenses.html';
        return null;
      }
      return result;
    } catch (e) {
      window.location.href = 'staff-login.html?next=staff-expenses.html';
      return null;
    }
  }

  async function loadTypes() {
    try {
      const resp = await fetch('/api/expenses?types=1');
      const result = await resp.json();
      expenseTypes = (result.ok && result.types) ? result.types : [];
      const list = document.getElementById('expenseTypeList');
      if (list) list.innerHTML = expenseTypes.map(t => `<option value="${escapeHtmlAttr(t)}"></option>`).join('');
    } catch (e) { /* non-fatal -- form just has no suggestions */ }
  }

  function renderEntryForm() {
    entrySection.innerHTML = `
      <div class="entry-card">
        <h2>Log an expense</h2>
        <div class="entry-grid">
          <div class="field">
            <label>Date</label>
            <input type="date" id="expDate" value="${todayIso()}">
          </div>
          <div class="field">
            <label>Type</label>
            <input type="text" id="expType" list="expenseTypeList" placeholder="e.g. PR, Payment" autocomplete="off">
            <datalist id="expenseTypeList"></datalist>
          </div>
          <div class="field">
            <label>Recipient / Details</label>
            <input type="text" id="expDetails" placeholder="e.g. Doc Kathy, Checkbook - 2 booklets">
          </div>
          <div class="field">
            <label>Amount ₱</label>
            <input type="text" id="expAmount" inputmode="decimal" placeholder="0.00">
          </div>
          <button type="button" class="entry-add-btn" id="addExpenseBtn">Add expense</button>
        </div>
        <div class="entry-status" id="entryStatus"></div>
      </div>
    `;
    loadTypes();

    document.getElementById('addExpenseBtn').addEventListener('click', async () => {
      const dateEl = document.getElementById('expDate');
      const typeEl = document.getElementById('expType');
      const detailsEl = document.getElementById('expDetails');
      const amountEl = document.getElementById('expAmount');
      const statusEl = document.getElementById('entryStatus');
      const btn = document.getElementById('addExpenseBtn');

      const expense_date = dateEl.value;
      const type = typeEl.value.trim();
      const details = detailsEl.value.trim();
      const amount = parseFloat(amountEl.value);

      if (!expense_date) {
        statusEl.textContent = 'Date is required.';
        statusEl.className = 'entry-status error';
        return;
      }
      if (!type) {
        statusEl.textContent = 'Type is required.';
        statusEl.className = 'entry-status error';
        return;
      }
      if (!Number.isFinite(amount) || amount <= 0) {
        statusEl.textContent = 'Enter a valid amount.';
        statusEl.className = 'entry-status error';
        return;
      }

      btn.disabled = true;
      statusEl.textContent = 'Saving…';
      statusEl.className = 'entry-status';

      try {
        const resp = await fetch('/api/expenses', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ expense_date, type, details, amount }),
        });
        const result = await resp.json();
        if (!resp.ok || !result.ok) throw new Error(result.error || 'Could not save the expense.');

        statusEl.textContent = 'Saved.';
        statusEl.className = 'entry-status success';
        typeEl.value = '';
        detailsEl.value = '';
        amountEl.value = '';
        dateEl.value = todayIso();
        loadExpenses();
      } catch (err) {
        statusEl.textContent = err.message || 'Could not save the expense.';
        statusEl.className = 'entry-status error';
      } finally {
        btn.disabled = false;
      }
    });
  }

  async function loadExpenses() {
    content.innerHTML = '<div class="loading-state">Loading expenses…</div>';
    const params = new URLSearchParams();
    const { from, to } = periodFilter.getRange();
    if (from) params.set('from', from);
    if (to) params.set('to', to);

    try {
      const resp = await fetch('/api/expenses?' + params.toString());
      if (resp.status === 401) {
        window.location.href = 'staff-login.html?next=staff-expenses.html';
        return;
      }
      const result = await resp.json();
      if (!resp.ok || !result.ok) throw new Error(result.error || 'Could not load expenses.');

      totalValue.textContent = '₱' + Number(result.total || 0).toLocaleString('en-PH', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      renderExpenses(result.expenses || []);
    } catch (err) {
      content.innerHTML = `<div class="error-state">${escapeHtml(err.message)}</div>`;
    }
  }

  function renderExpenses(expenses) {
    if (!expenses.length) {
      content.innerHTML = '<div class="empty-state">No expenses in this range.</div>';
      return;
    }

    const rows = expenses.map(e => `
      <tr data-row-id="${e.id}">
        <td data-label="Date">${escapeHtml(e.expense_date)}</td>
        <td data-label="Type"><span class="type-chip">${escapeHtml(e.type)}</span></td>
        <td data-label="Recipient / Details">${escapeHtml(e.details) || '—'}</td>
        <td data-label="Amount">₱${escapeHtml(Number(e.amount).toLocaleString('en-PH', { minimumFractionDigits: 2, maximumFractionDigits: 2 }))}</td>
        <td data-label="Logged by">${escapeHtml(e.created_by) || '—'}</td>
        <td data-label="">${isAdmin ? `
          <div class="row-actions">
            <button type="button" class="edit-btn" data-id="${e.id}"
              data-date="${escapeHtmlAttr(e.expense_date)}" data-type="${escapeHtmlAttr(e.type)}"
              data-details="${escapeHtmlAttr(e.details || '')}" data-amount="${escapeHtmlAttr(e.amount)}">Edit</button>
            <button type="button" class="delete-btn" data-id="${e.id}">Delete</button>
          </div>
        ` : ''}</td>
      </tr>
    `).join('');

    content.innerHTML = `
      <table>
        <thead>
          <tr><th>Date</th><th>Type</th><th>Recipient / Details</th><th>Amount</th><th>Logged by</th><th></th></tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>
    `;

    content.querySelectorAll('.delete-btn').forEach(btn => {
      btn.addEventListener('click', async () => {
        if (!confirm('Delete this expense entry? This cannot be undone.')) return;
        const id = btn.getAttribute('data-id');
        btn.disabled = true;
        try {
          const resp = await fetch('/api/expenses?id=' + encodeURIComponent(id), { method: 'DELETE' });
          const result = await resp.json();
          if (!resp.ok || !result.ok) throw new Error(result.error || 'Could not delete this expense.');
          loadExpenses();
        } catch (err) {
          alert(err.message || 'Could not delete this expense.');
          btn.disabled = false;
        }
      });
    });

    content.querySelectorAll('.edit-btn').forEach(btn => {
      btn.addEventListener('click', () => startEditRow(btn));
    });
  }

  // Swaps a row's display cells for editable inputs in place, rather than
  // navigating to a separate edit screen -- expenses are simple enough
  // (4 fields) that an inline edit is quicker for staff than a full page.
  function startEditRow(btn) {
    const id = btn.getAttribute('data-id');
    const row = content.querySelector(`tr[data-row-id="${id}"]`);
    if (!row) return;
    const date = btn.getAttribute('data-date');
    const type = btn.getAttribute('data-type');
    const details = btn.getAttribute('data-details');
    const amount = btn.getAttribute('data-amount');

    row.classList.add('edit-row');
    row.innerHTML = `
      <td data-label="Date"><input type="date" class="edit-date" value="${escapeHtmlAttr(date)}"></td>
      <td data-label="Type"><input type="text" class="edit-type" value="${escapeHtmlAttr(type)}" list="expenseTypeList"></td>
      <td data-label="Recipient / Details"><input type="text" class="edit-details" value="${escapeHtmlAttr(details)}"></td>
      <td data-label="Amount"><input type="text" class="edit-amount" inputmode="decimal" value="${escapeHtmlAttr(amount)}"></td>
      <td data-label="Logged by"></td>
      <td data-label="">
        <div class="row-actions">
          <button type="button" class="save-edit-btn">Save</button>
          <button type="button" class="cancel-edit-btn">Cancel</button>
        </div>
        <div class="entry-status" style="margin-top:6px;"></div>
      </td>
    `;

    row.querySelector('.cancel-edit-btn').addEventListener('click', () => loadExpenses());
    row.querySelector('.save-edit-btn').addEventListener('click', async () => {
      const dateEl = row.querySelector('.edit-date');
      const typeEl = row.querySelector('.edit-type');
      const detailsEl = row.querySelector('.edit-details');
      const amountEl = row.querySelector('.edit-amount');
      const statusEl = row.querySelector('.entry-status');
      const saveBtn = row.querySelector('.save-edit-btn');

      const expense_date = dateEl.value;
      const type = typeEl.value.trim();
      const details = detailsEl.value.trim();
      const amount = parseFloat(amountEl.value);

      if (!expense_date || !type || !Number.isFinite(amount) || amount <= 0) {
        statusEl.textContent = 'Check date, type, and amount.';
        statusEl.className = 'entry-status error';
        return;
      }

      saveBtn.disabled = true;
      statusEl.textContent = 'Saving…';
      statusEl.className = 'entry-status';

      try {
        const resp = await fetch('/api/expenses?id=' + encodeURIComponent(id), {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ expense_date, type, details, amount }),
        });
        const result = await resp.json();
        if (!resp.ok || !result.ok) throw new Error(result.error || 'Could not save changes.');
        loadExpenses();
      } catch (err) {
        statusEl.textContent = err.message || 'Could not save changes.';
        statusEl.className = 'entry-status error';
        saveBtn.disabled = false;
      }
    });
  }


  // ---------------------------------------------------------------------
  // Withdrawal tab (cash/check payroll runs, owner draws, etc.) -- always
  // admin-only, no staff-access flag like Expenses has. Same entry-form +
  // list + inline-edit pattern as Expenses above, against
  // /api/expenses?resource=withdrawals (kept in the same serverless
  // function as expenses since this project is already at Vercel's
  // 12-function cap).
  // ---------------------------------------------------------------------
  const withdrawalEntrySection = document.getElementById('withdrawalEntrySection');
  const withdrawalContent = document.getElementById('withdrawalContent');
  const withdrawalTotalValue = document.getElementById('withdrawalTotalValue');
  const withdrawalCashValue = document.getElementById('withdrawalCashValue');
  const withdrawalCheckValue = document.getElementById('withdrawalCheckValue');
  let withdrawalsLoadedOnce = false;

  const withdrawalPeriodFilter = PeriodFilter.mount(document.getElementById('withdrawalPeriodFilterMount'), {
    defaultPreset: 'last7',
    onChange: () => loadWithdrawals(),
  });

  function fmtPeso(n) {
    return '₱' + Number(n || 0).toLocaleString('en-PH', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  function renderWithdrawalEntryForm() {
    withdrawalEntrySection.innerHTML = `
      <div class="entry-card">
        <h2>Log a withdrawal</h2>
        <div class="entry-grid">
          <div class="field">
            <label>Date</label>
            <input type="date" id="wdDate" value="${todayIso()}">
          </div>
          <div class="field">
            <label>Description</label>
            <input type="text" id="wdDescription" placeholder="e.g. PAYROLL - MAY">
          </div>
          <div class="field">
            <label>Source</label>
            <select id="wdSource">
              <option value="cash">Cash</option>
              <option value="check">Check</option>
            </select>
          </div>
          <div class="field">
            <label>Amount ₱</label>
            <input type="text" id="wdAmount" inputmode="decimal" placeholder="0.00">
          </div>
          <button type="button" class="entry-add-btn" id="addWithdrawalBtn">Add withdrawal</button>
        </div>
        <div class="entry-status" id="withdrawalEntryStatus"></div>
      </div>
    `;

    document.getElementById('addWithdrawalBtn').addEventListener('click', async () => {
      const dateEl = document.getElementById('wdDate');
      const descEl = document.getElementById('wdDescription');
      const sourceEl = document.getElementById('wdSource');
      const amountEl = document.getElementById('wdAmount');
      const statusEl = document.getElementById('withdrawalEntryStatus');
      const btn = document.getElementById('addWithdrawalBtn');

      const withdrawal_date = dateEl.value;
      const description = descEl.value.trim();
      const source = sourceEl.value;
      const amount = parseFloat(amountEl.value);

      if (!withdrawal_date) {
        statusEl.textContent = 'Date is required.';
        statusEl.className = 'entry-status error';
        return;
      }
      if (!description) {
        statusEl.textContent = 'Description is required.';
        statusEl.className = 'entry-status error';
        return;
      }
      if (!Number.isFinite(amount) || amount <= 0) {
        statusEl.textContent = 'Enter a valid amount.';
        statusEl.className = 'entry-status error';
        return;
      }

      btn.disabled = true;
      statusEl.textContent = 'Saving…';
      statusEl.className = 'entry-status';

      try {
        const resp = await fetch('/api/expenses?resource=withdrawals', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ withdrawal_date, description, source, amount }),
        });
        const result = await resp.json();
        if (!resp.ok || !result.ok) throw new Error(result.error || 'Could not save the withdrawal.');

        statusEl.textContent = 'Saved.';
        statusEl.className = 'entry-status success';
        descEl.value = '';
        amountEl.value = '';
        dateEl.value = todayIso();
        sourceEl.value = 'cash';
        loadWithdrawals();
      } catch (err) {
        statusEl.textContent = err.message || 'Could not save the withdrawal.';
        statusEl.className = 'entry-status error';
      } finally {
        btn.disabled = false;
      }
    });
  }

  async function loadWithdrawals() {
    withdrawalContent.innerHTML = '<div class="loading-state">Loading withdrawals…</div>';
    const params = new URLSearchParams();
    params.set('resource', 'withdrawals');
    const { from, to } = withdrawalPeriodFilter.getRange();
    if (from) params.set('from', from);
    if (to) params.set('to', to);

    try {
      const resp = await fetch('/api/expenses?' + params.toString());
      if (resp.status === 401) {
        window.location.href = 'staff-login.html?next=staff-expenses.html';
        return;
      }
      if (resp.status === 403) {
        withdrawalContent.innerHTML = '<div class="error-state">Withdrawals are admin-only.</div>';
        withdrawalTotalValue.textContent = fmtPeso(0);
        withdrawalCashValue.textContent = fmtPeso(0);
        withdrawalCheckValue.textContent = fmtPeso(0);
        return;
      }
      const result = await resp.json();
      if (!resp.ok || !result.ok) throw new Error(result.error || 'Could not load withdrawals.');

      withdrawalTotalValue.textContent = fmtPeso(result.total);
      withdrawalCashValue.textContent = fmtPeso(result.total_cash);
      withdrawalCheckValue.textContent = fmtPeso(result.total_check);
      renderWithdrawals(result.withdrawals || []);
    } catch (err) {
      withdrawalContent.innerHTML = `<div class="error-state">${escapeHtml(err.message)}</div>`;
    }
  }

  function renderWithdrawals(withdrawals) {
    if (!withdrawals.length) {
      withdrawalContent.innerHTML = '<div class="empty-state">No withdrawals in this range.</div>';
      return;
    }

    const rows = withdrawals.map(w => `
      <tr data-row-id="${w.id}">
        <td data-label="Date">${escapeHtml(w.withdrawal_date)}</td>
        <td data-label="Description">${escapeHtml(w.description)}</td>
        <td data-label="Amount">${fmtPeso(w.amount)}</td>
        <td data-label="Source"><span class="source-chip">${w.source === 'check' ? 'Check' : 'Cash'}</span></td>
        <td data-label="Cash">${w.source === 'cash' ? fmtPeso(w.amount) : '—'}</td>
        <td data-label="Checking">${w.source === 'check' ? fmtPeso(w.amount) : '—'}</td>
        <td data-label="Logged by">${escapeHtml(w.created_by) || '—'}</td>
        <td data-label="">
          <div class="row-actions">
            <button type="button" class="edit-btn" data-id="${w.id}"
              data-date="${escapeHtmlAttr(w.withdrawal_date)}" data-description="${escapeHtmlAttr(w.description)}"
              data-source="${escapeHtmlAttr(w.source)}" data-amount="${escapeHtmlAttr(w.amount)}">Edit</button>
            <button type="button" class="delete-btn" data-id="${w.id}">Delete</button>
          </div>
        </td>
      </tr>
    `).join('');

    withdrawalContent.innerHTML = `
      <table>
        <thead>
          <tr><th>Date</th><th>Description</th><th>Amount</th><th>Source</th><th>Cash</th><th>Checking</th><th>Logged by</th><th></th></tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>
    `;

    withdrawalContent.querySelectorAll('.delete-btn').forEach(btn => {
      btn.addEventListener('click', async () => {
        if (!confirm('Delete this withdrawal? This cannot be undone.')) return;
        const id = btn.getAttribute('data-id');
        btn.disabled = true;
        try {
          const resp = await fetch('/api/expenses?resource=withdrawals&id=' + encodeURIComponent(id), { method: 'DELETE' });
          const result = await resp.json();
          if (!resp.ok || !result.ok) throw new Error(result.error || 'Could not delete this withdrawal.');
          loadWithdrawals();
        } catch (err) {
          alert(err.message || 'Could not delete this withdrawal.');
          btn.disabled = false;
        }
      });
    });

    withdrawalContent.querySelectorAll('.edit-btn').forEach(btn => {
      btn.addEventListener('click', () => startEditWithdrawalRow(btn));
    });
  }

  function startEditWithdrawalRow(btn) {
    const id = btn.getAttribute('data-id');
    const row = withdrawalContent.querySelector(`tr[data-row-id="${id}"]`);
    if (!row) return;
    const date = btn.getAttribute('data-date');
    const description = btn.getAttribute('data-description');
    const source = btn.getAttribute('data-source');
    const amount = btn.getAttribute('data-amount');

    row.classList.add('edit-row');
    row.innerHTML = `
      <td data-label="Date"><input type="date" class="edit-date" value="${escapeHtmlAttr(date)}"></td>
      <td data-label="Description"><input type="text" class="edit-description" value="${escapeHtmlAttr(description)}"></td>
      <td data-label="Amount"><input type="text" class="edit-amount" inputmode="decimal" value="${escapeHtmlAttr(amount)}"></td>
      <td data-label="Source">
        <select class="edit-source">
          <option value="cash" ${source === 'cash' ? 'selected' : ''}>Cash</option>
          <option value="check" ${source === 'check' ? 'selected' : ''}>Check</option>
        </select>
      </td>
      <td data-label="Cash"></td>
      <td data-label="Checking"></td>
      <td data-label="Logged by"></td>
      <td data-label="">
        <div class="row-actions">
          <button type="button" class="save-edit-btn">Save</button>
          <button type="button" class="cancel-edit-btn">Cancel</button>
        </div>
        <div class="entry-status" style="margin-top:6px;"></div>
      </td>
    `;

    row.querySelector('.cancel-edit-btn').addEventListener('click', () => loadWithdrawals());
    row.querySelector('.save-edit-btn').addEventListener('click', async () => {
      const dateEl = row.querySelector('.edit-date');
      const descEl = row.querySelector('.edit-description');
      const sourceEl = row.querySelector('.edit-source');
      const amountEl = row.querySelector('.edit-amount');
      const statusEl = row.querySelector('.entry-status');
      const saveBtn = row.querySelector('.save-edit-btn');

      const withdrawal_date = dateEl.value;
      const description = descEl.value.trim();
      const source = sourceEl.value;
      const amount = parseFloat(amountEl.value);

      if (!withdrawal_date || !description || !Number.isFinite(amount) || amount <= 0) {
        statusEl.textContent = 'Check date, description, and amount.';
        statusEl.className = 'entry-status error';
        return;
      }

      saveBtn.disabled = true;
      statusEl.textContent = 'Saving…';
      statusEl.className = 'entry-status';

      try {
        const resp = await fetch('/api/expenses?resource=withdrawals&id=' + encodeURIComponent(id), {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ withdrawal_date, description, source, amount }),
        });
        const result = await resp.json();
        if (!resp.ok || !result.ok) throw new Error(result.error || 'Could not save changes.');
        loadWithdrawals();
      } catch (err) {
        statusEl.textContent = err.message || 'Could not save changes.';
        statusEl.className = 'entry-status error';
        saveBtn.disabled = false;
      }
    });
  }

  // ---- Tabs ----
  const tabBtnExpenses = document.getElementById('tabBtnExpenses');
  const tabBtnWithdrawal = document.getElementById('tabBtnWithdrawal');
  const panelExpenses = document.getElementById('panelExpenses');
  const panelWithdrawal = document.getElementById('panelWithdrawal');

  tabBtnExpenses.addEventListener('click', () => {
    tabBtnExpenses.classList.add('active');
    tabBtnWithdrawal.classList.remove('active');
    panelExpenses.classList.add('active');
    panelWithdrawal.classList.remove('active');
  });
  tabBtnWithdrawal.addEventListener('click', () => {
    tabBtnWithdrawal.classList.add('active');
    tabBtnExpenses.classList.remove('active');
    panelWithdrawal.classList.add('active');
    panelExpenses.classList.remove('active');
    if (!withdrawalsLoadedOnce) {
      withdrawalsLoadedOnce = true;
      renderWithdrawalEntryForm();
      loadWithdrawals();
    }
  });

  document.getElementById('logoutBtn').addEventListener('click', async () => {
    await fetch('/api/staff-auth?action=logout', { method: 'POST' });
    window.location.href = 'staff-login.html';
  });

  (async function init() {
    const auth = await checkAuth();
    if (!auth) return;

    if (auth.role !== 'admin') {
      document.getElementById('notAdminState').style.display = 'block';
      document.querySelectorAll('.nav-admin-only').forEach(el => el.remove());
      return;
    }
    isAdmin = true;
    document.getElementById('mainWrap').style.display = 'block';

    renderEntryForm();
    loadExpenses();
  })();
})();
</script>

<script src="staff-assistant.js" defer></script>
</body>
</html>
