<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cash Position — DCAM Optical (Staff)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Sora:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --purple: #B05A9E;
    --purple-deep: #8F4680;
    --blue: #5BAFC0;
    --blue-deep: #458F9E;
    --ivory: #F7F1E8;
    --ivory-dim: #EFE6D8;
    --charcoal: #383334;
    --charcoal-soft: #4A4547;
    --line: rgba(56,51,52,0.14);
    --green: #3E8E5A;
    --red: #B0405A;
    --display: 'Plus Jakarta Sans', sans-serif;
    --body: 'Sora', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--ivory); color: var(--charcoal); font-family: var(--body); }

  .staff-bar {
    background: var(--charcoal);
    color: var(--ivory);
    padding: 14px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
  }
  .staff-bar .tag {
    font-family: var(--display);
    font-weight: 700;
    font-size: 0.82rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--blue);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .staff-bar .actions { display: flex; gap: 10px; flex-wrap: wrap; }
  .staff-bar a, .staff-bar button {
    font-family: var(--display);
    font-weight: 600;
    font-size: 0.85rem;
    padding: 9px 18px;
    border-radius: 100px;
    border: none;
    cursor: pointer;
    text-decoration: none;
    display: inline-block;
  }
  .btn-light { background: var(--ivory); color: var(--charcoal); }
  .btn-ghost { background: transparent; color: var(--ivory); border: 1px solid rgba(247,241,232,0.4) !important; }
  .btn-ghost:hover { background: rgba(247,241,232,0.1); }

  .wrap { max-width: 1040px; margin: 0 auto; padding: 32px 24px 80px; }

  h1.page-title { font-family: var(--display); font-size: 1.3rem; margin-bottom: 4px; }
  .page-subtitle { color: var(--charcoal-soft); font-size: 0.88rem; margin-bottom: 22px; }

  .card {
    background: #fff;
    border-radius: 16px;
    padding: 22px 24px;
    margin-bottom: 22px;
    box-shadow: 0 10px 30px rgba(56,51,52,0.06);
  }
  .card h2 {
    font-family: var(--display);
    font-size: 1rem;
    margin-bottom: 14px;
  }
  .card p.note {
    font-size: 0.85rem;
    color: var(--charcoal-soft);
    margin-bottom: 14px;
    line-height: 1.5;
  }

  .seed-grid {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr 1fr auto;
    gap: 10px;
    align-items: end;
  }
  .field label {
    display: block;
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--charcoal-soft);
    margin-bottom: 4px;
    font-family: var(--display);
    font-weight: 700;
  }
  .field input {
    width: 100%;
    border: 1.5px solid var(--line);
    background: #fff;
    padding: 10px 12px;
    border-radius: 8px;
    font-family: var(--body);
    font-size: 0.9rem;
    color: var(--charcoal);
    outline: none;
  }
  .field input:focus { border-color: var(--blue); }

  .btn-primary {
    font-family: var(--display);
    font-weight: 700;
    font-size: 0.85rem;
    padding: 10px 20px;
    border-radius: 8px;
    border: none;
    background: var(--purple);
    color: #fff;
    cursor: pointer;
    white-space: nowrap;
  }
  .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }
  .btn-primary.confirm { background: var(--green); }

  .status-msg { font-size: 0.82rem; margin-top: 10px; }
  .status-msg.error { color: var(--red); }
  .status-msg.success { color: var(--green); }

  .balance-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 14px;
    margin-bottom: 18px;
  }
  .balance-tile {
    background: var(--ivory-dim);
    border-radius: 12px;
    padding: 14px 16px;
  }
  .balance-tile .label {
    font-family: var(--display);
    font-weight: 700;
    font-size: 0.68rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--charcoal-soft);
    margin-bottom: 6px;
  }
  .balance-tile .value {
    font-family: var(--display);
    font-weight: 800;
    font-size: 1.15rem;
  }

  .section-label {
    font-family: var(--display);
    font-weight: 700;
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--purple-deep);
    margin: 18px 0 10px;
  }

  .activity-list { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 24px; margin-bottom: 4px; }
  .activity-row {
    display: flex;
    justify-content: space-between;
    padding: 8px 0;
    border-bottom: 1px solid var(--line);
    font-size: 0.9rem;
  }
  .activity-row .amt { font-family: var(--display); font-weight: 700; }
  .activity-row .amt.pos { color: var(--green); }
  .activity-row .amt.neg { color: var(--red); }

  .close-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    flex-wrap: wrap;
    margin-top: 18px;
    padding-top: 18px;
    border-top: 1.5px solid var(--line);
  }
  .closed-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-family: var(--display);
    font-weight: 700;
    font-size: 0.78rem;
    color: var(--green);
  }

  table {
    width: 100%;
    border-collapse: collapse;
    background: #fff;
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 10px 30px rgba(56,51,52,0.06);
  }
  thead th {
    text-align: left;
    font-family: var(--display);
    font-weight: 700;
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--charcoal-soft);
    background: var(--ivory-dim);
    padding: 10px 14px;
    white-space: nowrap;
  }
  tbody td {
    padding: 10px 14px;
    border-top: 1px solid var(--line);
    font-size: 0.85rem;
    white-space: nowrap;
  }
  tbody tr:hover { background: var(--ivory-dim); }

  .not-admin-state { text-align: center; padding: 80px 20px; color: var(--charcoal-soft); }
  .empty-state, .loading-state, .error-state {
    text-align: center;
    padding: 40px 20px;
    color: var(--charcoal-soft);
    font-size: 0.95rem;
  }
  .error-state { color: var(--red); }

  @media (max-width: 720px) {
    .seed-grid { grid-template-columns: 1fr 1fr; }
    .seed-grid .btn-primary { grid-column: 1 / -1; }
    .balance-grid { grid-template-columns: 1fr 1fr; }
    .activity-list { grid-template-columns: 1fr; }
    table, thead, tbody, th, td, tr { display: block; }
    thead { display: none; }
    tbody tr {
      border: 1px solid var(--line);
      border-radius: 10px;
      margin-bottom: 12px;
      padding: 10px 14px;
    }
    tbody td {
      border: none;
      padding: 6px 0;
      display: flex;
      justify-content: space-between;
      gap: 10px;
      white-space: normal;
    }
    tbody td::before {
      content: attr(data-label);
      font-family: var(--display);
      font-weight: 700;
      font-size: 0.7rem;
      text-transform: uppercase;
      color: var(--charcoal-soft);
    }
  }
</style>
<script type="module" src="/analytics.js"></script>
</head>
<body>

<div class="staff-bar">
  <div class="tag">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
    Staff only — cash position
  </div>
  <div class="actions">
    <a href="staff-dashboard.html" class="btn-light">Dashboard</a>
    <a href="staff-orders.html" class="btn-light">Orders</a>
    <a href="staff-catalog.html" class="btn-light">Catalog</a>
    <a href="staff-reports.html" class="btn-light">Reports</a>
    <a href="staff-expenses.html" class="btn-light nav-admin-only">Expenses</a>
    <a href="staff-settings.html" class="btn-light nav-admin-only">Settings</a>
    <a href="staff-patient-lookup.html" class="btn-light">Patient lookup</a>
    <button class="btn-ghost" id="logoutBtn">Log out</button>
  </div>
</div>

<div class="wrap" id="mainWrap" style="display:none;">
  <h1 class="page-title">Daily Cash Reconciliation</h1>
  <div class="page-subtitle">Cash, Gcash, and checking balances — closed out once a day, same as the CashFlow sheet.</div>

  <div id="seedCard"></div>
  <div id="todayCard"></div>

  <div class="section-label">Closed days</div>
  <div id="historyContent">
    <div class="loading-state">Loading history…</div>
  </div>
</div>

<div class="not-admin-state" id="notAdminState" style="display:none;">
  <p>This page requires an admin account.</p>
</div>

<script>
(function() {
  const seedCard = document.getElementById('seedCard');
  const todayCard = document.getElementById('todayCard');
  const historyContent = document.getElementById('historyContent');

  function escapeHtml(str) {
    return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }
  function fmtPeso(n) {
    const num = Number(n || 0);
    return (num < 0 ? '-' : '') + '₱' + Math.abs(num).toLocaleString('en-PH', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }
  function fmtDate(iso) {
    if (!iso) return '—';
    const d = new Date(iso + 'T00:00:00');
    return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
  }

  async function checkAuth() {
    try {
      const resp = await fetch('/api/staff-auth');
      const result = await resp.json();
      if (!result.authenticated) {
        window.location.href = 'staff-login.html?next=staff-cashflow.html';
        return null;
      }
      return result;
    } catch (e) {
      window.location.href = 'staff-login.html?next=staff-cashflow.html';
      return null;
    }
  }

  function renderSeedForm() {
    seedCard.innerHTML = `
      <div class="card">
        <h2>Set opening balances</h2>
        <p class="note">This is a one-time entry for the very first day, since there's no prior day to carry balances from. Every day after this, beginning balances are copied automatically from the previous day's closing numbers once that day is closed.</p>
        <div class="seed-grid">
          <div class="field">
            <label>Cash ₱</label>
            <input type="text" id="seedCash" inputmode="decimal" placeholder="0.00">
          </div>
          <div class="field">
            <label>Gcash ₱</label>
            <input type="text" id="seedGcash" inputmode="decimal" placeholder="0.00">
          </div>
          <div class="field">
            <label>Checking ₱</label>
            <input type="text" id="seedChecking" inputmode="decimal" placeholder="0.00">
          </div>
          <div class="field">
            <label>Outstanding owed ₱</label>
            <input type="text" id="seedOutstanding" inputmode="decimal" placeholder="0.00">
          </div>
          <button type="button" class="btn-primary" id="saveSeedBtn">Save opening balances</button>
        </div>
        <div class="status-msg" id="seedStatus"></div>
      </div>
    `;

    document.getElementById('saveSeedBtn').addEventListener('click', async () => {
      const cashEl = document.getElementById('seedCash');
      const gcashEl = document.getElementById('seedGcash');
      const checkingEl = document.getElementById('seedChecking');
      const outstandingEl = document.getElementById('seedOutstanding');
      const statusEl = document.getElementById('seedStatus');
      const btn = document.getElementById('saveSeedBtn');

      const beginning_cash = parseFloat(cashEl.value) || 0;
      const beginning_gcash = parseFloat(gcashEl.value) || 0;
      const beginning_checking = parseFloat(checkingEl.value) || 0;
      const beginning_outstanding = parseFloat(outstandingEl.value) || 0;

      if ([beginning_cash, beginning_gcash, beginning_checking, beginning_outstanding].some(n => n < 0)) {
        statusEl.textContent = 'Opening balances cannot be negative.';
        statusEl.className = 'status-msg error';
        return;
      }

      btn.disabled = true;
      statusEl.textContent = 'Saving…';
      statusEl.className = 'status-msg';

      try {
        const resp = await fetch('/api/expenses?resource=cashflow&action=seed', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ beginning_cash, beginning_gcash, beginning_checking, beginning_outstanding }),
        });
        const result = await resp.json();
        if (!resp.ok || !result.ok) throw new Error(result.error || 'Could not save opening balances.');
        statusEl.textContent = 'Saved.';
        statusEl.className = 'status-msg success';
        loadToday();
      } catch (err) {
        statusEl.textContent = err.message || 'Could not save opening balances.';
        statusEl.className = 'status-msg error';
        btn.disabled = false;
      }
    });
  }

  function renderTodayDraft(position) {
    const net = position.ending_cash + position.ending_gcash + position.ending_checking;
    todayCard.innerHTML = `
      <div class="card">
        <h2>Today — ${fmtDate(position.position_date)} <span style="font-weight:500;color:var(--charcoal-soft);font-size:0.8rem;">(draft, updates live)</span></h2>

        <div class="section-label" style="margin-top:0;">Beginning of day</div>
        <div class="balance-grid">
          <div class="balance-tile"><div class="label">Cash</div><div class="value">${fmtPeso(position.beginning_cash)}</div></div>
          <div class="balance-tile"><div class="label">Gcash</div><div class="value">${fmtPeso(position.beginning_gcash)}</div></div>
          <div class="balance-tile"><div class="label">Checking</div><div class="value">${fmtPeso(position.beginning_checking)}</div></div>
          <div class="balance-tile"><div class="label">Outstanding owed</div><div class="value">${fmtPeso(position.beginning_outstanding)}</div></div>
        </div>

        <div class="section-label">Today's activity</div>
        <div class="activity-list">
          <div class="activity-row"><span>Cash sales</span><span class="amt pos">+${fmtPeso(position.cash_sales)}</span></div>
          <div class="activity-row"><span>Gcash sales</span><span class="amt pos">+${fmtPeso(position.gcash_sales)}</span></div>
          <div class="activity-row"><span>Expenses</span><span class="amt neg">-${fmtPeso(position.total_expenses)}</span></div>
          <div class="activity-row"><span>New outstanding (unpaid balance)</span><span class="amt">${fmtPeso(position.outstanding_created)}</span></div>
          <div class="activity-row"><span>Withdrawals — cash</span><span class="amt neg">-${fmtPeso(position.total_withdrawals_cash)}</span></div>
          <div class="activity-row"><span>Withdrawals — checking</span><span class="amt neg">-${fmtPeso(position.total_withdrawals_checking)}</span></div>
        </div>

        <div class="section-label">Ending balance (projected)</div>
        <div class="balance-grid">
          <div class="balance-tile"><div class="label">Cash</div><div class="value">${fmtPeso(position.ending_cash)}</div></div>
          <div class="balance-tile"><div class="label">Gcash</div><div class="value">${fmtPeso(position.ending_gcash)}</div></div>
          <div class="balance-tile"><div class="label">Checking</div><div class="value">${fmtPeso(position.ending_checking)}</div></div>
          <div class="balance-tile"><div class="label">Outstanding owed</div><div class="value">${fmtPeso(position.ending_outstanding)}</div></div>
        </div>

        <div class="close-bar">
          <div style="font-size:0.85rem;color:var(--charcoal-soft);">Total cash on hand (cash + Gcash + checking): <strong style="color:var(--charcoal);">${fmtPeso(net)}</strong></div>
          <button type="button" class="btn-primary confirm" id="closeDayBtn">Close the day</button>
        </div>
        <div class="status-msg" id="closeStatus"></div>
      </div>
    `;

    document.getElementById('closeDayBtn').addEventListener('click', async () => {
      if (!confirm('Close today’s cash position? This locks in today’s numbers permanently and cannot be reopened.')) return;
      const btn = document.getElementById('closeDayBtn');
      const statusEl = document.getElementById('closeStatus');
      btn.disabled = true;
      statusEl.textContent = 'Closing…';
      statusEl.className = 'status-msg';
      try {
        const resp = await fetch('/api/expenses?resource=cashflow&action=close', { method: 'POST' });
        const result = await resp.json();
        if (!resp.ok || !result.ok) throw new Error(result.error || 'Could not close the day.');
        statusEl.textContent = 'Day closed.';
        statusEl.className = 'status-msg success';
        loadToday();
        loadHistory();
      } catch (err) {
        statusEl.textContent = err.message || 'Could not close the day.';
        statusEl.className = 'status-msg error';
        btn.disabled = false;
      }
    });
  }

  function renderTodayClosed(position) {
    todayCard.innerHTML = `
      <div class="card">
        <h2>Today — ${fmtDate(position.position_date)}</h2>
        <div class="closed-badge">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M20 6L9 17l-5-5"/></svg>
          Closed at ${new Date(position.closed_at).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' })}${position.closed_by ? ' by ' + escapeHtml(position.closed_by) : ''}
        </div>
        <div class="section-label">Ending balance</div>
        <div class="balance-grid">
          <div class="balance-tile"><div class="label">Cash</div><div class="value">${fmtPeso(position.ending_cash)}</div></div>
          <div class="balance-tile"><div class="label">Gcash</div><div class="value">${fmtPeso(position.ending_gcash)}</div></div>
          <div class="balance-tile"><div class="label">Checking</div><div class="value">${fmtPeso(position.ending_checking)}</div></div>
          <div class="balance-tile"><div class="label">Outstanding owed</div><div class="value">${fmtPeso(position.ending_outstanding)}</div></div>
        </div>
      </div>
    `;
  }

  async function loadToday() {
    todayCard.innerHTML = '<div class="card"><div class="loading-state">Loading today’s cash position…</div></div>';
    try {
      const resp = await fetch('/api/expenses?resource=cashflow&action=today');
      if (resp.status === 401) {
        window.location.href = 'staff-login.html?next=staff-cashflow.html';
        return;
      }
      const result = await resp.json();
      if (!resp.ok || !result.ok) throw new Error(result.error || 'Could not load today’s cash position.');

      if (result.isFirstDay) {
        renderSeedForm();
      } else {
        seedCard.innerHTML = '';
      }

      if (result.closed) {
        renderTodayClosed(result.position);
      } else {
        renderTodayDraft(result.position);
      }
    } catch (err) {
      todayCard.innerHTML = `<div class="card"><div class="error-state">${escapeHtml(err.message)}</div></div>`;
    }
  }

  async function loadHistory() {
    historyContent.innerHTML = '<div class="loading-state">Loading history…</div>';
    try {
      const resp = await fetch('/api/expenses?resource=cashflow&action=history');
      const result = await resp.json();
      if (!resp.ok || !result.ok) throw new Error(result.error || 'Could not load history.');

      const positions = result.positions || [];
      if (!positions.length) {
        historyContent.innerHTML = '<div class="empty-state">No closed days yet.</div>';
        return;
      }

      const rows = positions.map(p => `
        <tr>
          <td data-label="Date">${fmtDate(p.position_date)}</td>
          <td data-label="Cash sales">${fmtPeso(p.cash_sales)}</td>
          <td data-label="Gcash sales">${fmtPeso(p.gcash_sales)}</td>
          <td data-label="Expenses">${fmtPeso(p.total_expenses)}</td>
          <td data-label="Withdrawals">${fmtPeso(Number(p.total_withdrawals_cash || 0) + Number(p.total_withdrawals_checking || 0))}</td>
          <td data-label="Ending cash">${fmtPeso(p.ending_cash)}</td>
          <td data-label="Ending Gcash">${fmtPeso(p.ending_gcash)}</td>
          <td data-label="Ending checking">${fmtPeso(p.ending_checking)}</td>
          <td data-label="Outstanding">${fmtPeso(p.ending_outstanding)}</td>
        </tr>
      `).join('');

      historyContent.innerHTML = `
        <table>
          <thead>
            <tr><th>Date</th><th>Cash sales</th><th>Gcash sales</th><th>Expenses</th><th>Withdrawals</th><th>Ending cash</th><th>Ending Gcash</th><th>Ending checking</th><th>Outstanding</th></tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>
      `;
    } catch (err) {
      historyContent.innerHTML = `<div class="error-state">${escapeHtml(err.message)}</div>`;
    }
  }

  document.getElementById('logoutBtn').addEventListener('click', async () => {
    await fetch('/api/staff-auth?action=logout', { method: 'POST' });
    window.location.href = 'staff-login.html';
  });

  (async function init() {
    const auth = await checkAuth();
    if (!auth) return;

    if (auth.role !== 'admin') {
      document.getElementById('notAdminState').style.display = 'block';
      document.querySelectorAll('.nav-admin-only').forEach(el => el.remove());
      return;
    }
    document.getElementById('mainWrap').style.display = 'block';

    loadToday();
    loadHistory();
  })();
})();
</script>

<script src="staff-assistant.js" defer></script>
</body>
</html>
